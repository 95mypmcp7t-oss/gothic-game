<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пепел Спящего</title>

<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:#000;
  background-image:url('https://raw.githubusercontent.com/95mypmcp7t-oss/gothic-game/main/gothic_bg.jpg');
  background-size:cover;
  background-attachment:fixed;
  color:#e8d9a6;
  font-family: Georgia, serif;
}

#game {
  max-width:700px;
  margin:40px auto;
  padding:18px;
  background:rgba(0,0,0,0.82);
  border:3px solid #caa44a;
  border-radius:6px;
  box-shadow:0 0 25px #000;
}

h1 {
  text-align:center;
  font-family:"Uncial Antiqua";
  letter-spacing:2px;
  font-size:24px;
  margin-top:0;
  color:#f1d27c;
}

.stats {
  background:rgba(0,0,0,0.7);
  border:2px solid #aa8844;
  padding:10px;
  margin-bottom:12px;
  font-size:14px;
}

#text {
  white-space:pre-line;
  font-size:16px;
  line-height:1.45;
  margin-bottom:14px;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  background:rgba(0,0,0,0.4);
  border:2px solid #caa44a;
  color:#e8d9a6;
  font-size:18px;
  border-radius:4px;
}

button:hover, button:active {
  background:#caa44a;
  color:#000;
}
</style>
</head>

<body>
<div id="game">
  <h1>Пепел Спящего</h1>
  <div class="stats" id="stats"></div>
  <div id="text"></div>
  <div id="choices"></div>
  <button onclick="newGame()">Новая игра</button>
</div>

<script>
let player = JSON.parse(localStorage.getItem("player")) || {
  strength:2,
  dexterity:2,
  charisma:1,
  hp:12,
  maxhp:12,
  weapon:"Кулаки",
  damage:1,
  armor:0,
  armorName:"нет брони",
  gold:10,
  potions:1,
  inventory:[],
  quest:{rat:false, tavern:false, bandits:false},
  reputation:0,
};

function save(){localStorage.setItem("player", JSON.stringify(player));}
function newGame(){localStorage.removeItem("player");location.reload();}
function stat(){document.getElementById("stats").innerText=
`HP: ${player.hp}/${player.maxhp} | Сила: ${player.strength} | Ловкость: ${player.dexterity} | Харизма: ${player.charisma}
Оружие: ${player.weapon} (${player.damage}) | Броня: ${player.armorName} (${player.armor}) | Золото: ${player.gold} | Зелий: ${player.potions}`;
}

function show(text, choices){
 document.getElementById("text").innerText=text;
 const c=document.getElementById("choices");
 c.innerHTML="";
 choices.forEach(ch=>{
 let b=document.createElement("button");
 b.innerText=ch.text;
 b.onclick=()=>{ch.action();save();};
 c.appendChild(b);
 });
 stat();
}

// ====== ПОЦЕЛУИ ЖИЗНИ 😎 ======
function drinkPotion(){
 if(player.potions<=0){
  show("У тебя нет зелий.",[{text:"Назад",action:start}]);return;
 }
 player.potions--;
 player.hp += 8;
 if(player.hp>player.maxhp) player.hp=player.maxhp;
 show("Ты выпил зелье. Тебе стало лучше.",[{text:"Назад",action:start}]);
}

// ====== БОЙ ======
function battle(enemy, win, lose){
 if(player.hp<=0){show("Ты слишком ранен...",[{text:"Назад",action:start}]);return;}

 let hit = Math.random()>0.1; // шанс промаха врага
 let crit = Math.random()<0.2; // шанс крита героя
 let dmg = player.damage + player.strength;
 if(crit) dmg+=2;

 enemy.hp -= dmg;
 let text = `${enemy.name}\nHP врага: ${enemy.hp <= 0?0:enemy.hp}\n\nТы наносишь ${dmg} урона${crit? " (КРИТ!)":""}`;

 if(enemy.hp<=0){win();return;}

 let enemyHit = Math.max(enemy.damage - player.armor,0);
 if(hit){
 player.hp -= enemyHit;
 text+=`\nВраг атакует — ${enemyHit} урона`;
 } else text+="\nВраг промахнулся!";

 if(player.hp<=0){lose();return;}

 show(text,[
  {text:"Продолжить бой",action:()=>battle(enemy,win,lose)},
  {text:"Попробовать сбежать",action:start},
  {text:"Выпить зелье",action:drinkPotion}
 ]);
}

// ====== ЛОКАЦИИ ======
function start(){
 show(
`Гавань Хориниса.

Мир будто чувствует напряжение.
И это только начало...`,
[
 {text:"Страж у ворот",action:guard},
 {text:"Склады",action:warehouse},
 {text:"Трущобы",action:slums},
 {text:"Таверна",action:tavern},
 {text:"Лес",action:forest},
 {text:"Проверить инвентарь",action:inv},
 {text:"Выпить зелье лечения",action:drinkPotion}
]);
}

// ====== NPC + КВЕСТЫ ======
function guard(){
 if(!player.quest.rat){
 show("— В трущобах проблемы. Убей крысу — получишь монеты.",[
  {text:"Взять квест",action:()=>{player.quest.rat=true;start();}},
  {text:"Уйти",action:start}
 ]);
 } 
 else if(player.quest.rat==="done"){
 player.gold+=15;
 player.reputation++;
 player.quest.rat="rewarded";
 show("— Неплохо. Вот твои монеты.",[{text:"Назад",action:start}]);
 }
 else show("— Ну так чего стоишь?",[{text:"Назад",action:start}]);
}

function warehouse(){
 show("Склады. Спокойно. Слишком спокойно.",[
 {text:"Обыскать ящики",action:()=>{
  player.strength++;
  show("Ты находишь Пепел. Чувствуешь силу.",[{text:"Назад",action:start}]);
 }},
 {text:"Назад",action:start}
]);
}

function slums(){
 if(player.quest.rat===true){
 let rat={name:"КРЫСА",hp:6,damage:1};
 battle(rat,
 ()=>{player.quest.rat="done";show("Крыса убита.",[{text:"Назад",action:start}]);},
 ()=>{show("Ты пал...",[{text:"Заново",action:newGame}]);}
 );
 return;
 }
 show("Трущобы. Здесь выживают сильные.",[{text:"Назад",action:start}]);
}

// ====== ТАВЕРНА ======
function tavern(){
 if(!player.quest.tavern){
 show("Хозяин таверны:\n— Бандиты в лесу грабят путников. Разберёшься?",[
  {text:"Взять квест",action:()=>{player.quest.tavern=true;forest();}},
  {text:"Уйти",action:start}
 ]);
 } else if(player.quest.tavern==="done"){
 player.gold+=20;
 player.potions++;
 player.quest.tavern="rewarded";
 show("— Отлично! Держи монеты и зелье. Ты нам нужен.",[{text:"Назад",action:start}]);
 } else {
 forest();
 }
}

// ====== ЛЕС ======
function forest(){
 show("Лес. Здесь опасно.",[
 {text:"Искать неприятности",action:forestFight},
 {text:"Назад",action:start}
]);
}

function forestFight(){
 if(player.quest.tavern){
 let bandit={name:"БАНДИТ",hp:14,damage:3};
 battle(bandit,
 ()=>{
  player.weapon="Охотничий меч";
  player.damage=4;
  player.armor=1;
  player.armorName="Лёгкая кожаная броня";
  player.quest.tavern="done";
  show("Бандит повержен. Ты находишь меч и броню.",[{text:"Назад",action:start}]);
 },
 ()=>{show("Тебя порезали как салагу...",[{text:"Заново",action:newGame}]);}
 );
 } else {
 let wolf={name:"ВОЛК",hp:12,damage:2};
 battle(wolf,
 ()=>{
  player.gold+=10;
  player.potions++;
  show("Ты победил волка и находишь зелье.",[{text:"Назад",action:start}]);
 },
 ()=>{show("Волк разорвал тебя...",[{text:"Заново",action:newGame}]);}
 );
 }
}

// ====== ИНВЕНТАРЬ ======
function inv(){
 show(
`Инвентарь:
Оружие: ${player.weapon}
Броня: ${player.armorName}
Золото: ${player.gold}
Зелий: ${player.potions}`,
[{text:"Назад",action:start}]
);
}

start();
</script>
</body>
</html>
