<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Каторжник — Шахта (полный прототип)</title>
<style>
:root{--bg:#071018;--panel:#0e161a;--accent:#8eeaff;--muted:#9fb0bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e6f6f8;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:10px}
#app{width:100%;max-width:980px;background:#06121a;border-radius:10px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:18px;color:var(--accent)}
.main{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.panel{background:var(--panel);padding:10px;border-radius:8px}
#story{min-height:220px;max-height:360px;overflow:auto;padding:8px;line-height:1.45}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
button.choice{background:linear-gradient(180deg,#16333a,#0f2728);color:#e6fbff;border:0;padding:12px;border-radius:8px;text-align:left;font-size:15px}
.hud{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.hud div{background:#081217;padding:6px;border-radius:6px}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.locbtn{padding:8px;border-radius:8px;border:0;background:#0f2a2e;color:#dff7fb}
.inv-row{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px dashed rgba(255,255,255,0.03)}
.icon{width:36px;height:36px;border-radius:6px;margin-right:8px}
.small{font-size:13px;color:var(--muted)}
.footer{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
/* responsive */
@media (min-width:800px){ #story{min-height:320px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Каторжник — Шахта (полный прототип)</h1>
    <div class="hud" id="hud">
      <div id="hpDisp">HP:140</div>
      <div id="stDisp">STA:120</div>
      <div id="goldDisp">₿20</div>
      <div id="repDisp" class="small">Репутация: Каторжане 0 / Ночники 0 / Секта 0</div>
    </div>
  </header>

  <div class="main">
    <div class="panel" id="story">Загрузка...</div>
    <div class="panel" id="choices"></div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div>
          <button class="locbtn" onclick="goTo('Лагерь')">🏕 Лагерь</button>
          <button class="locbtn" onclick="enterMine(1)">⬆ Верхний</button>
          <button class="locbtn" onclick="enterMine(2)">↔ Средний</button>
          <button class="locbtn" onclick="enterMine(3)">⬇ Нижний</button>
          <button class="locbtn" onclick="enterSpecial('Камера')">⚒ Камера-пресс</button>
          <button class="locbtn" onclick="enterSpecial('Причал')">⚓ Причал</button>
          <button class="locbtn" onclick="enterSpecial('Руины')">🏛 Руины</button>
        </div>
        <div>
          <button class="locbtn" onclick="showInv()">Инвентарь</button>
          <button class="locbtn" onclick="showQuests()">Квесты</button>
          <button class="locbtn" onclick="showGuild()">Гильдия воров</button>
        </div>
      </div>

      <div id="invPanel" style="margin-top:8px;display:none">
        <div><strong>Инвентарь</strong></div>
        <div id="invList"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="locbtn" onclick="closeInv()">Закрыть</button>
        </div>
      </div>

      <div id="questsPanel" style="margin-top:8px;display:none">
        <div><strong>Квесты</strong></div>
        <div id="questsList" class="small"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="locbtn" onclick="closeQuests()">Закрыть</button>
        </div>
      </div>

      <div id="guildPanel" style="margin-top:8px;display:none">
        <div><strong>Гильдия воров</strong></div>
        <div id="guildText" class="small"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="locbtn" onclick="closeGuild()">Закрыть</button>
        </div>
      </div>

    </div>

    <div class="panel">
      <div id="log" style="height:160px;overflow:auto" class="small"></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <div>
          <button class="locbtn" onclick="saveGame()">Сохранить</button>
          <button class="locbtn" onclick="loadGame()">Загрузить</button>
          <button class="locbtn" onclick="resetGame()">Сброс</button>
        </div>
        <div class="small">Без звука — мобильная версия</div>
      </div>
    </div>
  </div>

  <div class="footer small">
    <div>Одна страница, прототип</div>
    <div>Копируйте весь файл как game.html</div>
  </div>
</div>

<script>
/* Полный прототип — часть 1/4
   Содержит структуры, иконки, начальные данные и утилиты.
*/

/* ---- Иконки (dataURI SVG) ---- */
const ICONS = {
  player: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#8eeaff'/></svg>`),
  ore: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#5a7b3a'/><circle cx='18' cy='18' r='7' fill='#bfe07a'/></svg>`),
  part: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#7d6f3f'/><rect x='6' y='14' width='24' height='8' fill='#c8b27a'/></svg>`),
  crystal: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#2b2b4b'/><polygon points='18,6 28,26 8,26' fill='#b89cff'/></svg>`),
  sword: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#c6c6c6'/><rect x='16' y='6' width='4' height='20' fill='#666'/></svg>`),
  armor: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#6b7f8f'/><rect x='8' y='8' width='20' height='20' fill='#445'/></svg>`),
  potion: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#3b1f3f'/><circle cx='18' cy='18' r='8' fill='#ff6b6b'/></svg>`),
  npc: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#ffd27f'/></svg>`),
  mineTile: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='80'><rect width='120' height='80' fill='#243b3f'/><text x='60' y='42' text-anchor='middle' fill='#a8d0cf' font-size='14'>Шахта</text></svg>`)
};

/* ---- Состояние игры ---- */
let state = {
  player: {name:'Каин',hp:160,maxHp:160,st:140,maxSt:140,atk:10,armor:0,gold:30,ore:0,xp:0,lvl:1},
  inv: [
    {id:'bread',name:'Хлеб',type:'consum',desc:'+20 выносливости',qty:2,icon:ICONS.player},
    {id:'potion',name:'Зелье здоровья',type:'consum',desc:'+50 HP',qty:1,icon:ICONS.potion},
    {id:'knife',name:'Нож',type:'weapon',atk:3,desc:'Простой нож',qty:1,icon:ICONS.sword}
  ],
  quests: [
    {id:'q1',title:'Отработать смену',status:'active',progress:0,goal:6,desc:'Соберите 6 единиц руды для склада.'},
    {id:'q2',title:'Починка вентилятора',status:'active',desc:'Найдите металлический клапан и отнесите Торну.'},
    {id:'q3',title:'Тайник Ночников',status:'locked',desc:'Разузнайте про тайник под средним уровнем.'},
    {id:'q4',title:'Исследование руин',status:'locked',desc:'Найдите вход в руины храма.'},
    {id:'q5',title:'Гильдия воров — испытание',status:'locked',desc:'Проявите навыки скрытности и воровства.'}
  ],
  reputation: {kat:0, smug:0, sect:0, guards:0},
  location: 'Лагерь',
  mine: {level:0,tiles:[]},
  inCombat:false, currentMob:null,
  flags: {fanBroken:true,knowSecret:false,foundCrystal:false,docsTaken:false,canEscape:false,guildJoined:false},
  logs: [],
  npcs: {} /* дополнительные данные будут заполнены */
};

/* ---- NPC: данные, диалоги, торговля, кузница, знахарка, лидеры ---- */
state.npcs = {
  torn: {id:'torn',name:'Торн',role:'старый рударь',icon:ICONS.npc,dialog:'Хочешь жить — учись копать. Найдёшь клапан — помогу.',shop:null},
  mira: {id:'mira',name:'Мира',role:'информатор',icon:ICONS.npc,dialog:'Я знаю тайники. Поможешь — поделюсь.',shop:null},
  edric: {id:'edric',name:'Эдрик',role:'кузнец',icon:ICONS.npc,dialog:'Приноси материалы — кую оружие и броню.',shop:null},
  yan: {id:'yan',name:'Ян',role:'торговец',icon:ICONS.npc,dialog:'Я куплю руду и продам снаряжение.',shop:{
    buy:{ore:7}, // price per ore
    sell:[
      {id:'short_sword',name:'Короткий меч',type:'weapon',atk:6,price:50,icon:ICONS.sword},
      {id:'leather',name:'Кожаная броня',type:'armor',armor:3,price:80,icon:ICONS.armor},
      {id:'map',name:'Карта руин',type:'misc',price:40,icon:ICONS.mineTile}
    ]
  }},
  helga: {id:'helga',name:'Хельга',role:'знахарка',icon:ICONS.npc,dialog:'Я могу лечить за золото или зелья.',shop:null},
  squinn: {id:'squinn',name:'Сквин',role:'лидер банды',icon:ICONS.npc,dialog:'Когти охотятся в тоннелях. Хотите риск?'},
  loret: {id:'loret',name:'Лорет',role:'исследователь',icon:ICONS.npc,dialog:'Кристаллы — не просто руда. Их корни древнее.'},
  guildmaster: {id:'guildmaster',name:'Маэстро воров',role:'гильдия',icon:ICONS.npc,dialog:'Хочешь вступить в Гильдию? Пройди испытание.'}
};

/* ---- Утилиты UI ---- */
const storyEl = document.getElementById('story');
const choicesEl = document.getElementById('choices');
const invPanel = document.getElementById('invPanel');
const invList = document.getElementById('invList');
const questsPanel = document.getElementById('questsPanel');
const questsList = document.getElementById('questsList');
const guildPanel = document.getElementById('guildPanel');
const guildText = document.getElementById('guildText');
const logEl = document.getElementById('log');
const hpDisp = document.getElementById('hpDisp');
const stDisp = document.getElementById('stDisp');
const goldDisp = document.getElementById('goldDisp');
const repDisp = document.getElementById('repDisp');

function pushLog(s){ state.logs.unshift((new Date()).toLocaleTimeString()+' — '+s); if(state.logs.length>200) state.logs.pop(); logEl.innerHTML = state.logs.join('<br>'); }
function updateHUD(){ hpDisp.innerText = `HP:${state.player.hp}`; stDisp.innerText = `STA:${state.player.st}`; goldDisp.innerText = `₿${state.player.gold}`; repDisp.innerText = `Репутация: К${state.reputation.kat} / Н${state.reputation.smug} / С${state.reputation.sect}`; }
function showChoices(list){ choicesEl.innerHTML=''; list.forEach(ch=>{ const b=document.createElement('button'); b.className='choice'; b.innerText = ch.label; b.onclick = ()=>{ ch.action(); }; choicesEl.appendChild(b); }); }

/* ---- Инвентарь ---- */
function showInv(){ questsPanel.style.display='none'; guildPanel.style.display='none'; invPanel.style.display='block'; renderInv(); }
function closeInv(){ invPanel.style.display='none'; }
function renderInv(){ invList.innerHTML=''; if(state.inv.length===0) invList.innerHTML = '<div class="small">Пусто</div>'; else state.inv.forEach((it,idx)=>{ const row=document.createElement('div'); row.className='inv-row'; row.innerHTML = `<div style="display:flex;align-items:center"><img class="icon" src="${it.icon||ICONS.player}"/><div><strong>${it.name}</strong><div class="small">${it.desc}</div></div></div><div style="text-align:right"><div class="small">x${it.qty||1}</div><div style="margin-top:6px"><button class="locbtn" onclick="useItem(${idx})">Использовать</button> <button class="locbtn" onclick="equipItem(${idx})">Экипировать</button> <button class="locbtn" onclick="dropItem(${idx})">Выбросить</button></div></div>`; invList.appendChild(row); }); }
function useItem(idx){ const it = state.inv[idx]; if(!it) return; if(it.type==='consum'){ if(it.id==='bread'){ state.player.st = Math.min(state.player.maxSt, state.player.st + 20); pushLog('Хлеб: +20 выносливости'); } else if(it.id==='potion'){ state.player.hp = Math.min(state.player.maxHp, state.player.hp + 50); pushLog('Зелье: +50 HP'); } it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else pushLog('Нельзя использовать этот предмет прямо сейчас.'); }
function equipItem(idx){ const it = state.inv[idx]; if(!it) return; if(it.type==='weapon'){ state.player.atk += it.atk||0; pushLog('Экипировано оружие: '+it.name); it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else if(it.type==='armor'){ state.player.armor += it.armor||0; pushLog('Надета броня: '+it.name); it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else pushLog('Нельзя экипировать этот предмет.'); }
function dropItem(idx){ const it = state.inv[idx]; if(!it) return; if(confirm('Выбросить '+it.name+'?')){ state.inv.splice(idx,1); renderInv(); pushLog('Вы выбросили '+it.name); } }

/* ---- Квесты ---- */
function showQuests(){ invPanel.style.display='none'; guildPanel.style.display='none'; questsPanel.style.display='block'; renderQuests(); }
function closeQuests(){ questsPanel.style.display='none'; }
function renderQuests(){ questsList.innerHTML = state.quests.map(q=>`<div style="margin-bottom:8px"><strong>${q.title}</strong> [${q.status}]<div class="small">${q.desc}${q.progress?('<br>Прогресс: '+q.progress+'/'+q.goal):''}</div></div>`).join(''); }
function completeQuest(id){ const q = state.quests.find(x=>x.id===id); if(q){ q.status='complete'; pushLog('Квест завершён: '+q.title); renderQuests(); } }

<script>
/* ---- Лор и история шахты ---- */
const LORE = {
  intro: `Остров Кромли — бывшая промышленная колония, превратившаяся в каторжную зону.
Руда здесь необычна: в глубинах встречаются фиолетовые кристаллы, источающие слабое мерцание. Долгое время корпорации и надзиратели добывали руду, не понимая истинной природы кристаллов. Теперь туман и странные существа делают работу опасной.
Каторжане делят остров на фракции: работяги, контрабандисты (Ночники), сектанты-исследователи, банды. Ваша задача — выжить, найти способ уйти или изменить судьбу острова.`,
  history: `История: Рудная лихорадка началась сто лет назад, когда первые шахтёры нашли редкую руду. Корпорации установили прессы и охраняемые склады. Позже появились первые свидетельства психических явлений вокруг кристаллов — их изучали скрытно, и часть знаний утеряна.
Легенда: в глубинах есть Храм — остаток древней цивилизации, что оставила кристаллы. Те, кто заглядывал в его свет, возвращались изменёнными.`,
  factions: `Фракции:
- Каторжане: простые работяги, хотят жить и уйти.
- Ночники: контрабандисты и торговцы, контролируют причал.
- Секта Лорета: ищут силу в кристаллах, готовы платить любую цену.
- Банды (Когти): маргиналы, нападают в тоннелях.
Отношения с фракциями влияют на доступ к товарам, квестам и финалам.`
};

/* ---- Доп. квесты и их логика ---- */
function initExtraQuests(){
  // добавить побочные квесты, если ещё не добавлены
  const qids = state.quests.map(q=>q.id);
  if(!qids.includes('q6')) state.quests.push({id:'q6',title:'Охота у входа',status:'active',progress:0,goal:3,desc:'Охотьтесь у входа в шахту: добыть кожу для ремесленника.'});
  if(!qids.includes('q7')) state.quests.push({id:'q7',title:'Вор (маленькая кража)',status:'locked',desc:'Выполните маленькую кражу для Гильдии, чтобы получить доверие.'});
  if(!qids.includes('q8')) state.quests.push({id:'q8',title:'Кузница: заказ кузнеца',status:'locked',desc:'Соберите материалы для Эдрика — получите рецепт ковать броню.'});
}
initExtraQuests();

/* ---- Передвижение и зоны шахты (расширенные) ---- */
function enterMine(level){
  state.mine.level = level;
  state.mine.tiles = [];
  // добавим более разнообразные тайлы: ore, animal, stash, mob, ruinEntrance (на нижнем)
  const oreCount = level===1?8:level===2?12:16;
  for(let i=0;i<oreCount;i++) state.mine.tiles.push({type:'ore'});
  // шанс животных у входа (охота)
  if(level===1) for(let i=0;i<4;i++) state.mine.tiles.push({type:'animal'});
  if(level===2){ state.mine.tiles.push({type:'part'}); state.mine.tiles.push({type:'stash'}); }
  if(level===3){ state.mine.tiles.push({type:'crystal'}); state.mine.tiles.push({type:'ruin'}); }
  // переместиться
  state.location = 'Шахта: Уровень '+level;
  renderLocation();
  pushLog('Спустились на уровень '+level);
}

function exploreMine(){
  if(state.mine.tiles.length===0){ pushLog('Здесь больше ничего не найдено.'); return; }
  const tile = state.mine.tiles.shift();
  if(tile.type==='ore'){ state.player.ore +=1; pushLog('Найдена руда'); checkQuestsOre(); updateHUD(); }
  else if(tile.type==='animal'){ // охота
    pushLog('Вы наткнулись на животных. Возможна охота.');
    showChoices([
      {label:'Охотиться', action: ()=>{ if(Math.random()<0.75){ giveItem({id:'hide',name:'Шкура',type:'material',qty:1,desc:'Кожа для ремесленника'}); pushLog('Охота успешна: найдена шкура'); checkQuestsHunt(); } else { pushLog('Животное убежало.'); } }},
      {label:'Не рисковать и пройти дальше', action: ()=>exploreMine()}
    ]);
    return;
  }
  else if(tile.type==='part'){ giveItem({id:'part',name:'Металлический клапан',type:'part',desc:'Для вентилятора',qty:1,icon:ICONS.part}); pushLog('Найден клапан'); }
  else if(tile.type==='stash'){ // тайник Ночников или бандитов
    pushLog('Найдена возможно заброшенная ниша — есть шанс на ценные вещи.');
    if(Math.random()<0.5){ giveItem({id:'goldp',name:'Мешочек золота',type:'gold',qty:1,amount:25,desc:'Немало золота'}); pushLog('В нише найдено золото!'); } else { giveItem({id:'rareore',name:'Редкая руда',type:'ore',qty:1,icon:ICONS.ore,desc:'Подойдёт Яну'}); pushLog('Найдена редкая руда.'); }
  }
  else if(tile.type==='crystal'){ showCrystalChoice(); return; }
  else if(tile.type==='ruin'){ // вход в руины
    pushLog('Вы нашли вход в руины. Это может быть важно для лора.');
    state.quests.find(q=>q.id==='q4').status='active';
    showChoices([{label:'Исследовать руины', action: exploreRuins}, {label:'Отложить', action: ()=>renderLocation()}]);
    return;
  }
  renderInv(); renderLocation();
}

/* ---- Охота и квест охоты ---- */
function checkQuestsHunt(){
  const q = state.quests.find(x=>x.id==='q6');
  if(q && q.status==='active'){ q.progress = (q.progress||0)+1; if(q.progress>=q.goal){ q.status='complete'; pushLog('Квест выполнен: Охота у входа'); state.player.gold += 25; pushLog('+25 золота'); } renderQuests(); }
}

/* ---- Воровство и Гильдия воров ---- */
function showGuild(){
  invPanel.style.display='none'; questsPanel.style.display='none'; guildPanel.style.display='block';
  if(!state.flags.guildJoined){
    guildText.innerHTML = `<p>Гильдия воров — подпольная сеть, которая помогает с прохождением патрулей, даёт задания по воровству и обмену. Они просят испытание — украсть сумку с рудой у Ночников.</p>`;
    showChoices([]); // убрать обычные choices

<script>
/* Часть 3/4 — боевая логика, торговля, кузница, лечение, AI мобов, сделки и механики воровства */

/* ---- Базовая боёвка (улучшенная) ---- */
function startCombat(){
  if(state.inCombat){ pushLog('Вы уже в бою'); return; }
  // выбираем врага в зависимости от локации/уровня
  let mob;
  if(state.location.startsWith('Шахта')){
    const lvl = state.mine.level || 1;
    if(lvl===1) mob = randomChoice([{name:'Рудная крыса',hp:22,atk:5},{name:'Грибник',hp:18,atk:4}]);
    if(lvl===2) mob = randomChoice([{name:'Бандит-Коготь',hp:34,atk:8},{name:'Грозовой волк',hp:28,atk:7}]);
    if(lvl===3) mob = randomChoice([{name:'Теневик',hp:48,atk:11},{name:'Каменный голем',hp:70,atk:13}]);
  } else if(state.location==='Камера'){
    mob = {name:'Охранник пресса',hp:40,atk:9};
  } else if(state.location==='Причал'){
    mob = randomChoice([{name:'Контрабандист',hp:30,atk:8},{name:'Ночник-страж',hp:36,atk:9}]);
  } else {
    mob = {name:'Дикий зверь',hp:20,atk:5};
  }
  state.currentMob = {...mob};
  state.inCombat = true;
  renderCombatUI();
  pushLog('Начало боя с ' + state.currentMob.name);
}

function renderCombatUI(){
  storyEl.innerHTML = `<p>БОЙ: вы против <strong>${state.currentMob.name}</strong> (HP: ${state.currentMob.hp})</p>
                       <p>Ваши HP: ${state.player.hp}, STA: ${state.player.st}</p>`;
  showChoices([
    {label:'Атаковать', action: doPlayerAttack},
    {label:'Уклониться', action: doPlayerDodge},
    {label:'Использовать предмет', action: ()=>{ showInv(); }},
    {label:'Побежать', action: tryFlee}
  ]);
}

function doPlayerAttack(){
  if(state.player.st < 8){ pushLog('Нет выносливости для атаки'); return; }
  state.player.st -= 8;
  const weaponBonus = getEquippedWeaponAtk();
  const base = state.player.atk + weaponBonus;
  const crit = Math.random() < 0.12;
  const variance = Math.floor(Math.random()*4);
  const dmg = Math.max(1, Math.floor(base * (crit?1.8:1)) + variance - Math.floor(state.currentMob.def||0));
  state.currentMob.hp -= dmg;
  pushLog(`Вы нанесли ${dmg} урона${crit? ' (крит)!':''}`);
  if(state.currentMob.hp <= 0){ pushLog('Враг повержен'); endCombat(true); return; }
  // противник атакует
  setTimeout(mobAttack, 300);
  updateHUD();
}

function doPlayerDodge(){
  if(state.player.st < 6){ pushLog('Нет выносливости для уклонения'); return; }
  state.player.st -= 6;
  if(Math.random() < 0.5){ state.currentMob.nextMiss = true; pushLog('Уклонение успешно — следующий удар врага промахнётся'); }
  else { pushLog('Уклонение не удалось'); mobAttack(); }
  updateHUD();
}

function mobAttack(){
  if(state.currentMob.nextMiss){ pushLog(state.currentMob.name+' промахнулся'); state.currentMob.nextMiss = false; return; }
  const dmg = Math.max(1, state.currentMob.atk - Math.floor(state.player.armor/2));
  state.player.hp -= dmg;
  pushLog(`${state.currentMob.name} наносит ${dmg} урона`);
  if(state.player.hp <= 0){ state.player.hp = 0; pushLog('Вы потеряли сознание'); endCombat(false); return; }
  updateHUD();
}

function tryFlee(){
  if(Math.random() < 0.5){ pushLog('Вам удалось уйти'); endCombat(false); } else { pushLog('Не удалось убежать'); mobAttack(); }
}

function endCombat(win){
  state.inCombat = false;
  if(win){
    const gold = 6 + Math.floor(Math.random()*12);
    state.player.gold += gold;
    // шанс дропа руды/частей
    if(Math.random() < 0.6) { state.player.ore += 1; pushLog('Вы добыли руду после боя'); checkQuestsOre(); }
    if(Math.random() < 0.25) { giveItem({id:'scrap',name:'Металлический лом',type:'material',qty:1,desc:'Материал для кузницы'}); }
    pushLog('Награда: +' + gold + ' золота');
    updateHUD();
  } else {
    pushLog('Бой окончен, вы в безопасности');
  }
  // возврат к локации
  renderLocation();
}

  showChoices(items.map(it=>({label:it.name+' — '+it.price+' зол.', action: ()=>{ if(state.player.gold < it.price){ pushLog('Недостаточно золота'); return; } state.player.gold -= it.price; giveItem({id:it.id,name:it.name,type:it.type,desc:it.name,qty:1,icon:it.icon,atk:it.atk,armor:it.armor}); pushLog('Куплено: '+it.name); updateHUD(); renderInv(); }}))).concat([{label:'Назад', action: ()=>openMarket()}]);

    {label:'Ковать меч (5 руды + 20 золота)', action: craftShortSword},

function craftShortSword(){

function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function hasItem(id){ return state.inv.some(x=>x.id===id); }
function removeItemById(id,count=1){ const idx = state.inv.findIndex(x=>x.id===id); if(idx>=0){ state.inv[idx].qty -= count; if(state.inv[idx].qty<=0) state.inv.splice(idx,1); renderInv(); } }
function giveItem(it){ const ex = state.inv.find(x=>x.id===it.id); if(ex) ex.qty += it.qty||1; else state.inv.push({...it}); renderInv(); pushLog('Получен: '+it.name); }
function getEquippedWeaponAtk(){ // sum weapon atk in inventory that was equipped — simplified: check specific ids

  showChoices([
    {label:'Попросить информацию о тайнике', action: ()=>{ state.quests.find(q=>q.id==='q3').status='active'; pushLog('Мира дала указание: найти тайник Ночников.'); }},
    {label:'Попросить о работе (разведка)', action: ()=>{ pushLog('Мира дала разведзадание: найти документы на Камере-пресс.'); state.flags.knowSecret = true; }},
    {label:'Вернуться', action: ()=>renderLocation()}
  ]);
}

function talkEdric(){
  openSmith();
}

function talkYan(){
  openMarket();
}

function talkHelga(){
  openHealer();
}

function talkLoret(){
  storyEl.innerHTML = `<p>Лорет: "Кристаллы не простая руда. Они — остатки сознания старой расы. Контакт с ними меняет память и волю."</p>`;
  showChoices([
    {label:'Спросить, что он знает о храме', action: ()=>{ pushLog('Лорет: "Храм — портал. Но порталы требуют ключей — осколков. Соберите их с осторожностью."'); }},
    {label:'Предложить помощь в исследовании', action: ()=>{ if(state.player.gold >= 20){ state.player.gold -=20; pushLog('Вы помогли Лорету — он делится информацией и заметками.'); state.reputation.sect +=1; updateHUD(); } else pushLog('Лорет: "Вернись, когда будешь готов платить."'); }},
    {label:'Вернуться', action: ()=>renderLocation()}
  ]);
}

/* ---- Гильдия воров — задания и последствия ---- */
function processGuildQuest(){
  const q = state.quests.find(x=>x.id==='q5');
  if(q && q.status==='active'){
    // игрок должен украсть у Ночников сумку (на причале)
    if(state.location === 'Причал' && Math.random() < 0.6){
      giveItem({id:'smug_bag',name:'Сумка Ночников',type:'loot',qty:1,desc:'Содержит золото и документы.'});
      q.status = 'complete';
      state.flags.guildJoined = true;
      state.reputation.smug += 2;
      pushLog('Вы успешно выполнили задание гильдии. Гильдия воров вас приняла.');
      renderInv();
    } else {
      pushLog('Здесь нет сумки, или вы были замечены. Попробуйте снова на причале ночью.');
      if(Math.random()<0.3){ pushLog('Ночники насторожились — репутация упала.'); state.reputation.smug -=1; }
    }
  }
}

/* ---- Камера-пресс — возможность найти документы и инициировать бунт ---- */
function showPress(){
  storyEl.innerHTML = `<p>Камера-пресс — место переработки руды. Документы о махинациях должны храниться в подсобке. Это опасно.</p>`;
  showChoices([
    {label:'Попытаться украсть документы (скрытно)', action: stealthFindDocs},
    {label:'Попытаться открыть подсобку силой', action: ()=>{ pushLog('Силовой метод привлёк охрану — начинается бой.'); startCombat(); }},
    {label:'Вернуться', action: ()=>renderLocation()}
  ]);
}
function stealthFindDocs(){
  // проверка на скрытность: если гильдия приняла — проще
  const chance = state.flags.guildJoined ? 0.85 : 0.45;
  if(Math.random() < chance){
    giveItem({id:'docs',name:'Документы о продаже руды',type:'quest',qty:1,desc:'Компромат на надзирателей'});
    state.flags.docsTaken = true;
    pushLog('Вы тихо добыли документы. Теперь можно шантажировать охрану или отдать Торну.');
  } else {
    pushLog('Вас заметили! Охрана наготове.');
    startCombat();
  }
}

/* ---- Причал — торговля и побег ---- */
function showDock(){
  storyEl.innerHTML = `<p>Причал — шум и туман. Здесь Ночники держат свои лодки и глазом следят за прибытием грузов.</p>`;
  showChoices([
    {label:'Попробовать договориться с Ночниками (торг)', action: tryDealWithSmugglers},
    {label:'Искать сумки/тайники (ворам)', action: ()=>{ if(state.flags.guildJoined) processGuildQuest(); else pushLog('Сначала вступите в гильдию воров.'); }},
    {label:'Осмотреть причал', action: ()=>{ if(Math.random()<0.3){ giveItem({id:'boat_key',name:'Ключ от лодки',type:'misc',qty:1,desc:'Ключ может помочь бежать'}); pushLog('Найден ключ от лодки!'); } else pushLog('Ничего полезного.'); }},
    {label:'Вернуться', action: ()=>goTo('Лагерь')}
  ]);
}
function tryDealWithSmugglers(){
  if(state.player.gold >= 50){
    state.player.gold -= 50;
    state.reputation.smug += 2;
    state.flags.canEscape = true;
    pushLog('Вы заплатили Ночникам. Они обещают помочь вам с побегом в будущем.');
    updateHUD();
  } else {
    pushLog('Ночники просят 50 золота за помощь. У вас недостаточно средств.');
  }
}

/* ---- Финальные ветви и концовки ---- */
function tryEscape(){
  // Варианты побега зависят от флагов и репутации
  if(!state.flags.canEscape && !state.flags.guildJoined){ pushLog('Нет доступного пути побега.'); return; }
  // выбрать метод: гильдия, Ночники, сила, руины (магия)
  showChoices([
    {label:'С побегом через Ночников (платно)', action: ()=>{ if(state.flags.canEscape){ pushLog('Ночники вывезли вас ночью — вы в безопасности, но оставили остальных. (Концовка: Побег с ценой.)'); endGame('smug'); } else pushLog('У вас нет сделки с Ночниками.'); }},
    {label:'Через гильдию воров (тайно)', action: ()=>{ if(state.flags.guildJoined){ pushLog('Гильдия вывезла вас групповым рейсом — вы ушли, помогая нескольким товарищам. (Концовка: Побег с ворами.)'); endGame('guild'); } else pushLog('Гильдия вас не приняла.'); }},
    {label:'Использовать силу кристаллов в руинах (риск)', action: ()=>{ if(state.flags.foundCrystal){ pushLog('Вы активировали портал руин. Свет поглотил вас... (Концовка: Магический путь).'); endGame('magic'); } else pushLog('У вас нет кристаллов.'); }},
    {label:'Отказаться и остаться (революция)', action: ()=>{ if(state.flags.docsTaken){ pushLog('Вы используете документы, чтобы поднять бунт. Это кровавая победа: остров освобождён, но многие погибли. (Концовка: Революция).'); endGame('revolt'); } else pushLog('Нет доказательств коррупции для организации бунта.'); }},
    {label:'Отмена', action: ()=>renderLocation()}
  ]);
}

function endGame(type){
  // простые тексты концовок
  let text = '';
  if(type==='smug') text = 'Вы уплываете с Ночниками. Свобода куплена кровью. Выжившие остаются на Кромли.';
  if(type==='guild') text = 'Гильдия воров вывезла вас вместе с близкими и несколькими товарищами. Вы свободны, но связаны тёмными долгами.';
  if(type==='magic') text = 'Портал открылся. Вы ушли, но мир изменился — кристаллы пробуждают древнюю силу.';
  if(type==='revolt') text = 'Вы подняли народ. Остров освобождён. Цена свободы велика, но новая жизнь началась.';
  // показать финальный экран
  storyEl.innerHTML = `<h3>Финал — ${type}</h3><p>${text}</p><p>Спасибо за игру. Можно начать заново.</p>`;
  choicesEl.innerHTML = '';
  showChoices([{label:'Новая игра', action: ()=>resetGame()},{label:'Сохранить и выйти', action: ()=>{ saveGame(); pushLog('Сохранено. Выход.'); }}]);
}

/* ---- Сохранение / Загрузка / Сброс ---- */
function saveGame(){ localStorage.setItem('katorzhnik_save', JSON.stringify(state)); pushLog('Игра сохранена'); }
function loadGame(){ const s = localStorage.getItem('katorzhnik_save'); if(!s){ pushLog('Сохранений нет'); return; } state = JSON.parse(s); updateHUD(); renderInv(); renderQuests(); pushLog('Сохранение загружено'); renderLocation(); }
function resetGame(){ if(!confirm('Сбросить прогресс?')) return; localStorage.removeItem('katorzhnik_save'); location.reload(); }

/* ---- Инициализация UI helpers и старт ---- */
function renderInv(){ invList.innerHTML=''; if(state.inv.length===0) invList.innerHTML = '<div class="small">Пусто</div>'; else state.inv.forEach((it,idx)=>{ const row=document.createElement('div'); row.className='inv-row'; row.innerHTML = `<div style="display:flex;align-items:center"><img class="icon" src="${it.icon||ICONS.player}"/><div><strong>${it.name}</strong><div class="small">${it.desc}</div></div></div><div style="text-align:right"><div class="small">x${it.qty||1}</div><div style="margin-top:6px"><button class="locbtn" onclick="useItem(${idx})">Использовать</button> <button class="locbtn" onclick="equipItem(${idx})">Экипировать</button> <button class="locbtn" onclick="dropItem(${idx})">Выбросить</button></div></div>`; invList.appendChild(row); }); }
function useItem(idx){ const it = state.inv[idx]; if(!it) return; if(it.type==='consum'){ if(it.id==='bread'){ state.player.st = Math.min(state.player.maxSt, state.player.st + 20); pushLog('Хлеб: +20 STA'); } else if(it.id==='potion'){ state.player.hp = Math.min(state.player.maxHp, state.player.hp + 50); pushLog('Зелье: +50 HP'); } it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else pushLog('Нельзя использовать этот предмет сейчас.'); }
function equipItem(idx){ const it = state.inv[idx]; if(!it) return; if(it.type==='weapon'){ state.player.atk += it.atk||0; pushLog('Экипировано: '+it.name); it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else if(it.type==='armor'){ state.player.armor += it.armor||0; pushLog('Надета броня: '+it.name); it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else pushLog('Нельзя экипировать этот предмет.'); }
function dropItem(idx){ const it = state.inv[idx]; if(!it) return; if(confirm('Выбросить '+it.name+'?')){ state.inv.splice(idx,1); renderInv(); pushLog('Вы выбросили '+it.name); } }
function hasItem(id){ return state.inv.some(x=>x.id===id); }

/* ---- Вспомогательные: показ UI и старт игры ---- */
function renderQuests(){ questsList.innerHTML = state.quests.map(q=>`<div style="margin-bottom:8px"><strong>${q.title}</strong> [${q.status}]<div class="small">${q.desc}${q.progress?('<br>Прогресс: '+q.progress+'/'+q.goal):''}</div></div>`).join(''); }
function updateHUD(){ hpDisp.innerText = `HP:${state.player.hp}`; stDisp.innerText = `STA:${state.player.st}`; goldDisp.innerText = `₿${state.player.gold}`; repDisp.innerText = `Репутация: К${state.reputation.kat} / Н${state.reputation.smug} / С${state.reputation.sect}`; renderQuests(); renderInv(); renderLog(); }
function renderLog(){ logEl.innerHTML = state.logs.join('<br>'); }
function renderLocation(){ if(state.location==='Лагерь') showCamp(); else if(state.location.startsWith('Шахта')) { storyEl.innerHTML = `<p>${state.location}. Что делаем?</p>`; showChoices([{label:'Исследовать', action: exploreMine},{label:'Искать бандитов', action: startCombat},{label:'Вернуться в лагерь', action: ()=>goTo('Лагерь')}]); } else if(state.location==='Камера') showPress(); else if(state.location==='Причал') showDock(); else if(state.location==='Руины') exploreRuins(); else showCamp(); }

/* ---- Запуск (инициализация) ---- */
pushLog('Инициализация финальной части. Игра готова.');
updateHUD();
showCamp();

/* ---- Экспорт глобальных функций (чтобы кнопки вызывали их) ---- */
window.goTo = goTo;
window.enterMine = enterMine;
window.enterSpecial = enterSpecial;
window.showInv = showInv;
window.closeInv = closeInv;
window.showQuests = showQuests;
window.closeQuests = closeQuests;
window.showGuild = showGuild;
window.processGuildQuest = processGuildQuest;
window.saveGame = saveGame;
window.loadGame = loadGame;
window.resetGame = resetGame;
window.openSmith = openSmith;
window.openMarket = openMarket;
window.openHealer = openHealer;
window.startCombat = startCombat;
window.exploreMine = exploreMine;

</script>
</body>
</html>
