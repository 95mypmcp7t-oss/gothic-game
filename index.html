<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пепел Спящего — v1.7 QUEST & CHAOS UPDATE</title>
<link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;color:#e8d9a6;font-family:Georgia,serif}
#game{max-width:760px;margin:40px auto;padding:18px;background:rgba(0,0,0,.9);border:3px solid #caa44a;border-radius:6px;box-shadow:0 0 25px #000}
h1{text-align:center;font-family:"Uncial Antiqua";color:#f1d27c;font-size:26px}
.stats{background:rgba(0,0,0,.7);border:2px solid #aa8844;padding:10px;margin-bottom:12px;font-size:14px}
#text{white-space:pre-line;font-size:16px;line-height:1.45;margin-bottom:14px}
img.scene{width:100%;border-radius:6px;margin-bottom:10px}
button{width:100%;padding:12px;margin-top:8px;background:rgba(0,0,0,.4);border:2px solid #caa44a;color:#e8d9a6;font-size:18px;border-radius:4px}
button:hover{background:#caa44a;color:#000}
</style>
</head>

<body>
<div id="game">
<h1>Пепел Спящего</h1>
<div class="stats" id="stats"></div>
<div id="text"></div>
<div id="choices"></div>
<button onclick="newGame()">Новая игра</button>
</div>

<script>
let player = JSON.parse(localStorage.getItem("player")) || {
strength:6,dexterity:4,charisma:3,
hp:32,maxhp:32,
mana:16,maxmana:16,
gold:100,potions:4,
weapon:"Кулаки",damage:2,
armor:0,armorName:"нет брони",
xp:0,level:1,
guild:null,thiefRank:null,
secretItems:0,
quest:null,
fate:null,fateProgress:0
};

function save(){localStorage.setItem("player",JSON.stringify(player))}
function newGame(){localStorage.removeItem("player");location.reload()}
function stat(){
document.getElementById("stats").innerText=
`Lv ${player.level} XP:${player.xp}/18
HP:${player.hp}/${player.maxhp}  Мана:${player.mana}/${player.maxmana}
Гильдия:${player.guild?player.guild:"нет"} ${player.thiefRank?"/ "+player.thiefRank:""}
Квест:${player.quest?player.quest:"нет"}
Оружие:${player.weapon} (${player.damage})  Броня:${player.armorName} (${player.armor})
Золото:${player.gold}  Зелий:${player.potions}  Секреты:${player.secretItems}`
}

function show(text,choices=[]){
document.getElementById("text").innerHTML=text
let c=document.getElementById("choices")
c.innerHTML=""
choices.forEach(ch=>{
let b=document.createElement("button")
b.innerText=ch.text
b.onclick=()=>{ch.action();save()}
c.appendChild(b)
})
stat()
}

function levelUp(){
if(player.xp<18)return
player.level++;player.xp=0;
player.maxhp+=6;player.hp=player.maxhp;
player.maxmana+=5;player.mana=player.maxmana;
show("Ты стал сильнее.",[{text:"Продолжить",action:start}])
}

function loot(){
player.gold+=Math.floor(Math.random()*35)+20
player.xp+=9
if(Math.random()<.5)player.potions++
levelUp()
}

function usePotion(back){
if(player.potions<=0){
show("Зелий нет.",[{text:"Назад",action:back}])
return
}
player.potions--
player.hp=Math.min(player.hp+20,player.maxhp)
show("Ты выпил зелье.",[{text:"Назад",action:back}])
}

/*** БОЙ ***/
function battle(enemy,img,onWin){
if(player.hp<=0){show("Ты слишком ранен.",[{text:"Назад",action:start}]);return}
let dmg=player.damage+player.strength
enemy.hp-=dmg
let t=`<img class="scene" src="${img}">
${enemy.name}
HP:${enemy.hp<0?0:enemy.hp}
Ты наносишь ${dmg}`

if(enemy.hp<=0){onWin();return}

let hit=Math.max(enemy.damage-player.armor,0)
player.hp-=hit
t+=`\nВраг бьёт ${hit}`

if(enemy.special==="яд"){
player.hp-=2
t+="\nЯД обжигает тебя!"
}
if(enemy.special==="броня" && Math.random()>.5){
t+="\nУдар почти не пробил броню врага!"
enemy.hp+=2
}

if(player.hp<=0){show("Ты погиб...",[{text:"Заново",action:newGame}]);return}

show(t,[
{text:"Биться",action:()=>battle(enemy,img,onWin)},
{text:"Выпить зелье",action:()=>usePotion(()=>battle(enemy,img,onWin))},
{text:"Сбежать",action:start}
])
}

/******** MAIN ********/
function start(){
show(
`<img class="scene" src="https://images.unsplash.com/photo-1614854262340-9f51e96f7f04?auto=format&fit=crop&w=1200&q=60">
Город полон жизни, боли, страха и возможностей.`,
[
{text:"Город",action:city},
{text:"Тёмные районы",action:slums},
{text:"Тайны",action:secrets},
{text:"Квесты (новое)",action:quests},
{text:"Лес",action:forest},
{text:"Пещеры",action:cave},
{text:"Большой рынок",action:market}
])
}

/******** ГОРОД ********/
function city(){
show("Каждый район города шепчет истории.",
[
{text:"Пристань",action:docks},
{text:"Переулки",action:alleys},
{text:"Дом аристократа",action:richHouse},
{text:"Площадь",action:plaza},
{text:"Назад",action:start}
])
}

/*** Пристань ***/
function docks(){
let enemies=[
{name:"Бандиты пристани",hp:28,damage:7},
{name:"Контрабандист",hp:32,damage:9,special:"яд"},
{name:"Наёмник",hp:35,damage:10}
]
let e=enemies[Math.floor(Math.random()*enemies.length)]
battle(e,
"https://images.unsplash.com/photo-1558981033-113a99c2d3b5?auto=format&fit=crop&w=1200&q=60",
()=>{loot();show("Пристань снова принадлежит хаосу.",[{text:"Назад",action:city}])})
}

/*** Площадь ***/
function plaza(){
let events=[
"Проповедник кричит, что «исчезающие люди — лишь начало».",
"Стража ищет кого-то. Люди отворачиваются.",
"Ты чувствуешь, как кто-то наблюдает за тобой."
]
show(events[Math.floor(Math.random()*events.length)],[{text:"Назад",action:city}])
}

/******** РЫНОК ********/
function market(){
show(
"Рынок огромен. Теперь здесь три раздела:",
[
{text:"Оружейник",action:smith},
{text:"Алхимик",action:alchemist},
{text:"Чёрный рынок",action:blackmarket},
{text:"Назад",action:start}
])
}

function smith(){
show("— Я делаю вещи, которые спасают жизни.",
[
{text:"Купить меч — 120 золота",action:()=>{
if(player.gold>=120){player.gold-=120;player.weapon="Боевой меч";player.damage=13;smith()}
else show("Мало золота.",[{text:"Назад",action:smith}])}},
{text:"Купить тяжёлую броню — 200 золота",action:()=>{
if(player.gold>=200){player.gold-=200;player.armor=5;player.armorName="Тяжёлая броня";smith()}
else show("Недостаточно.",[{text:"Назад",action:smith}])}},
{text:"Назад",action:market}
])
}

function alchemist(){
show("— Хочешь жить дольше? Плати.",
[
{text:"Купить зелье — 30 золота",action:()=>{
if(player.gold>=30){player.gold-=30;player.potions++;alchemist()}
else show("Мало золота.",[{text:"Назад",action:alchemist}])}},
{text:"Редкое зелье — 90 золота (даёт +макс HP)",action:()=>{
if(player.gold>=90){player.gold-=90;player.maxhp+=6;player.hp=player.maxhp;alchemist()}
else show("Недостаточно.",[{text:"Назад",action:alchemist}])}},
{text:"Назад",action:market}
])
}

function blackmarket(){
show("— Здесь есть то, что запрещено.",
[
{text:"Клинок убийцы — 240 золота",action:()=>{
if(player.gold>=240){player.gold-=240;player.weapon="Клинок убийцы";player.damage=17;blackmarket()}
else show("Нет денег.",[{text:"Назад",action:blackmarket}])}},
{text:"Амулет силы — 180 золота",action:()=>{
if(player.gold>=180){player.gold-=180;player.strength+=2;blackmarket()}
else show("Недостаточно.",[{text:"Назад",action:blackmarket}])}},
{text:"Назад",action:market}
])
}

/******** ВОРОВСКИЙ РАЙОН ********/
function slums(){
show("Здесь власть принадлежит тени.",
[
{text:"Искать гильдию воров",action:thiefGuild},
{text:"Назад",action:start}
])
}

function thiefGuild(){
if(!player.thiefRank){
show("— Мы видим тебя. Хочешь золота и славы тени?",
[
{text:"Вступить",action:()=>{player.guild="Воры";player.thiefRank="Новичок";player.dexterity++;start()}},
{text:"Уйти",action:start}
])
return
}

show("Гильдия ждёт дел.",
[
{text:"Мелкая работа",action:()=>thiefJob(1)},
{text:"Опасное дело",action:()=>thiefJob(2)},
{text:"Легендарный риск",action:()=>thiefJob(3)},
{text:"Назад",action:start}
])
}

function thiefJob(danger){
let chance=Math.random()
if(danger===1){
if(chance>.4){player.gold+=90;player.thiefRank="Проверенный";show("Чисто. Хорошая работа.",[{text:"Назад",action:start}])}
else{player.hp-=6;show("Поймали. Больно.",[{text:"Назад",action:start}])}
}
if(danger===2){
if(chance>.55){player.gold+=180;player.secretItems++;show("Ты сорвал куш!",[{text:"Назад",action:start}])}
else{player.hp-=12;show("Попался в ловушку.",[{text:"Назад",action:start}])}
}
if(danger===3){
if(player.thiefRank!=="Проверенный"){show("Гильдия не доверяет тебе такое дело.",[{text:"Назад",action:start}]);return}
if(chance>.6){
player.gold+=320;player.secretItems++;player.thiefRank="Мастер"
show("Теперь ты легенда тени.",[{text:"Назад",action:start}])
}else{
player.hp-=16
show("Ты был близок к смерти.",[{text:"Назад",action:start}])
}
}
}

/******** КВЕСТЫ ********/
function quests(){
if(!player.quest){
let q=[
"Помочь старику найти пропавшего сына.",
"Пробраться в дом знати и добыть письмо.",
"Уничтожить монстра, терроризирующего лес."
]
player.quest=q[Math.floor(Math.random()*q.length)]
show("Твой новый квест:\n\n"+player.quest,[{text:"Принять",action:start}])
return
}

if(Math.random()>.5){
player.gold+=200
player.xp+=12
player.quest=null
show("Квест выполнен. Тебя уважают.",[{text:"Назад",action:start}])
}else{
show("Квест пока не завершён.",[{text:"Назад",action:start}])
}
}

/******** ЛЕС ********/
function forest(){
let enemies=[
{name:"Волк",hp:26,damage:7},
{name:"Дикий зверь",hp:32,damage:9},
{name:"Теневой зверь",hp:38,damage:10,special:"яд"},
{name:"Лесной демон",hp:44,damage:12}
]
let e=enemies[Math.floor(Math.random()*enemies.length)]
battle(e,
"https://images.unsplash.com/photo-1601758124099-1a3b66ca4d4a?auto=format&fit=crop&w=1200&q=60",
()=>{loot();show("Ты возвращаешься живым.",[{text:"Назад",action:start}])})
}

/******** ПЕЩЕРЫ ********/
function cave(){
let enemies=[
{name:"Существо тьмы",hp:34,damage:10},
{name:"Тварь глубин",hp:42,damage:12,special:"броня"},
{name:"Хранитель тьмы",hp:50,damage:14},
{name:"Проклятый монстр",hp:56,damage:15,special:"яд"}
]
let e=enemies[Math.floor(Math.random()*enemies.length)]
battle(e,
"https://images.unsplash.com/photo-1508193638397-1c437248f26a?auto=format&fit=crop&w=1200&q=60",
()=>{loot();show("Пещеры снова злятся на тебя.",[{text:"Назад",action:start}])})
}

/******** СЕКРЕТЫ ********/
function secrets(){
if(Math.random()>.6){
player.secretItems++
show("Ты нашёл нечто такое, чего не должен был видеть.",[{text:"Назад",action:start}])
}else{
show("Город молчит… но не навсегда.",[{text:"Назад",action:start}])
}
}

start()
</script>
</body>
</html>
