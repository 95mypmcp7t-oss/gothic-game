<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Каторжник — Шахта (полный объединённый прототип)</title>
<style>
:root{--bg:#071018;--panel:#0e161a;--accent:#8eeaff;--muted:#9fb0bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e6f6f8;font-family:Inter,Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:10px}
#app{width:100%;max-width:980px;background:#06121a;border-radius:10px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:18px;color:var(--accent)}
.main{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.panel{background:var(--panel);padding:10px;border-radius:8px}
#story{min-height:240px;max-height:420px;overflow:auto;padding:10px;line-height:1.45}
#choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
button.choice{background:linear-gradient(180deg,#16333a,#0f2728);color:#e6fbff;border:0;padding:12px;border-radius:8px;text-align:left;font-size:15px}
.hud{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.hud div{background:#081217;padding:6px;border-radius:6px}
.locbtn{padding:8px;border-radius:8px;border:0;background:#0f2a2e;color:#dff7fb}
.inv-row{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px dashed rgba(255,255,255,0.03)}
.icon{width:36px;height:36px;border-radius:6px;margin-right:8px}
.small{font-size:13px;color:var(--muted)}
.footer{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
@media (min-width:800px){ #story{min-height:360px} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Каторжник — Шахта (полный)</h1>
    <div class="hud" id="hud">
      <div id="hpDisp">HP:160</div>
      <div id="stDisp">STA:140</div>
      <div id="goldDisp">₿30</div>
      <div id="repDisp" class="small">Репутация: Каторжане 0 / Ночники 0 / Секта 0</div>
    </div>
  </header>

  <div class="main">
    <div class="panel" id="story">Загрузка...</div>
    <div class="panel" id="choices"></div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="locbtn" onclick="goTo('Лагерь')">🏕 Лагерь</button>
          <button class="locbtn" onclick="enterMine(1)">⬆ Верхний</button>
          <button class="locbtn" onclick="enterMine(2)">↔ Средний</button>
          <button class="locbtn" onclick="enterMine(3)">⬇ Нижний</button>
          <button class="locbtn" onclick="enterSpecial('Камера')">⚒ Камера-пресс</button>
          <button class="locbtn" onclick="enterSpecial('Причал')">⚓ Причал</button>
          <button class="locbtn" onclick="enterSpecial('Руины')">🏛 Руины</button>
        </div>
        <div style="display:flex;gap:6px">
          <button class="locbtn" onclick="showInv()">Инвентарь</button>
          <button class="locbtn" onclick="showQuests()">Квесты</button>
          <button class="locbtn" onclick="showGuild()">Гильдия</button>
        </div>
      </div>

      <div id="invPanel" style="margin-top:8px;display:none" class="panel">
        <div><strong>Инвентарь</strong></div>
        <div id="invList"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="locbtn" onclick="closeInv()">Закрыть</button>
        </div>
      </div>

      <div id="questsPanel" style="margin-top:8px;display:none" class="panel">
        <div><strong>Квесты</strong></div>
        <div id="questsList" class="small"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="locbtn" onclick="closeQuests()">Закрыть</button>
        </div>
      </div>

      <div id="guildPanel" style="margin-top:8px;display:none" class="panel">
        <div><strong>Гильдия воров</strong></div>
        <div id="guildText" class="small"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="locbtn" onclick="closeGuild()">Закрыть</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div id="log" style="height:160px;overflow:auto" class="small"></div>
      <div style="display:flex;justify-content:space-between;margin-top:8px">
        <div style="display:flex;gap:6px">
          <button class="locbtn" onclick="saveGame()">Сохранить</button>
          <button class="locbtn" onclick="loadGame()">Загрузить</button>
          <button class="locbtn" onclick="resetGame()">Сброс</button>
        </div>
        <div class="small">Без звука — мобильная версия</div>
      </div>
    </div>
  </div>

  <div class="footer small">
    <div>Полный прототип — один HTML</div>
    <div>Сохраните как game.html</div>
  </div>
</div>

<script>
/* ----- Полный игровой скрипт ----- */

/* ICONS (dataURI SVG) */
const ICONS = {
  player: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#8eeaff'/></svg>`),
  ore: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#4b6b35'/><circle cx='18' cy='18' r='7' fill='#bfe07a'/></svg>`),
  part: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#7d6f3f'/><rect x='6' y='14' width='24' height='8' fill='#c8b27a'/></svg>`),
  crystal: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#2b2b4b'/><polygon points='18,6 28,26 8,26' fill='#b89cff'/></svg>`),
  sword: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#c6c6c6'/><rect x='16' y='6' width='4' height='20' fill='#666'/></svg>`),
  armor: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#6b7f8f'/><rect x='8' y='8' width='20' height='20' fill='#445'/></svg>`),
  potion: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#3b1f3f'/><circle cx='18' cy='18' r='8' fill='#ff6b6b'/></svg>`),
  npc: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><rect rx='6' width='36' height='36' fill='#ffd27f'/></svg>`),
  mineTile: 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='80'><rect width='120' height='80' fill='#243b3f'/><text x='60' y='42' text-anchor='middle' fill='#a8d0cf' font-size='14'>Шахта</text></svg>`)
};

/* INITIAL STATE */
let state = {
  player: {name:'Каин',hp:180,maxHp:180,st:150,maxSt:150,atk:10,armor:0,gold:40,ore:0,xp:0,lvl:1},
  inv: [
    {id:'bread',name:'Хлеб',type:'consum',desc:'+20 выносливости',qty:2,icon:ICONS.player},
    {id:'potion',name:'Зелье',type:'consum',desc:'+50 HP',qty:1,icon:ICONS.potion},
    {id:'knife',name:'Нож',type:'weapon',atk:3,desc:'Простой нож',qty:1,icon:ICONS.sword}
  ],
  quests: [
    {id:'q1',title:'Отработать смену',status:'active',progress:0,goal:6,desc:'Соберите 6 единиц руды.'},
    {id:'q2',title:'Починить вентилятор',status:'active',desc:'Найдите металлический клапан.'}
  ],
  reputation:{kat:0,smug:0,sect:0},
  location:'Лагерь',
  mine:{level:0,tiles:[]},
  inCombat:false,currentMob:null,
  flags:{fanBroken:true,foundCrystal:false,docsTaken:false,canEscape:false,guildJoined:false},
  logs:[]
};

/* NPCS */
state.npcs = {
  torn:{name:'Торн'}, mira:{name:'Мира'}, edric:{name:'Эдрик'}, yan:{name:'Ян'}, helga:{name:'Хельга'}, loret:{name:'Лорет'}, guildmaster:{name:'Маэстро'}
};

/* UI refs */
const storyEl = document.getElementById('story');
const choicesEl = document.getElementById('choices');
const invPanel = document.getElementById('invPanel');
const invList = document.getElementById('invList');
const questsPanel = document.getElementById('questsPanel');
const questsList = document.getElementById('questsList');
const guildPanel = document.getElementById('guildPanel');
const guildText = document.getElementById('guildText');
const logEl = document.getElementById('log');
const hpDisp = document.getElementById('hpDisp');
const stDisp = document.getElementById('stDisp');
const goldDisp = document.getElementById('goldDisp');
const repDisp = document.getElementById('repDisp');

/* Helpers */
function pushLog(s){ state.logs.unshift((new Date()).toLocaleTimeString()+' — '+s); if(state.logs.length>300) state.logs.pop(); logEl.innerHTML = state.logs.join('<br>'); }
function updateHUD(){ hpDisp.innerText = `HP:${state.player.hp}`; stDisp.innerText = `STA:${state.player.st}`; goldDisp.innerText = `₿${state.player.gold}`; repDisp.innerText = `Реп: К${state.reputation.kat} / Н${state.reputation.smug} / С${state.reputation.sect}`; }
function showChoices(list){ choicesEl.innerHTML=''; if(!list) return; list.forEach(ch=>{ const b=document.createElement('button'); b.className='choice'; b.innerText = ch.label; b.onclick = ()=>{ try{ ch.action(); }catch(e){ pushLog('Ошибка: '+e.message); console.error(e); } }; choicesEl.appendChild(b); }); }

/* Inventory UI */
function showInv(){ questsPanel.style.display='none'; guildPanel.style.display='none'; invPanel.style.display='block'; renderInv(); }
function closeInv(){ invPanel.style.display='none'; renderLocation(); }
function renderInv(){ invList.innerHTML=''; if(state.inv.length===0){ invList.innerHTML='<div class="small">Пусто</div>'; return; } state.inv.forEach((it,idx)=>{ const row=document.createElement('div'); row.className='inv-row'; row.innerHTML=`<div style="display:flex;align-items:center"><img class="icon" src="${it.icon||ICONS.player}"/><div><strong>${it.name}</strong><div class="small">${it.desc}</div></div></div><div style="text-align:right"><div class="small">x${it.qty||1}</div><div style="margin-top:6px"><button class="locbtn" onclick="useItem(${idx})">Использовать</button> <button class="locbtn" onclick="equipItem(${idx})">Экипировать</button> <button class="locbtn" onclick="dropItem(${idx})">Выбросить</button></div></div>`; invList.appendChild(row); }); }
function useItem(idx){ const it=state.inv[idx]; if(!it) return; if(it.type==='consum'){ if(it.id==='bread'){ state.player.st=Math.min(state.player.maxSt,state.player.st+20); pushLog('Хлеб: +20 STA'); } else if(it.id==='potion'){ state.player.hp=Math.min(state.player.maxHp,state.player.hp+50); pushLog('Зелье: +50 HP'); } it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else pushLog('Нельзя использовать'); }
function equipItem(idx){ const it=state.inv[idx]; if(!it) return; if(it.type==='weapon'){ state.player.atk += it.atk||0; pushLog('Экипировано '+it.name); it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else if(it.type==='armor'){ state.player.armor += it.armor||0; pushLog('Надета '+it.name); it.qty--; if(it.qty<=0) state.inv.splice(idx,1); renderInv(); updateHUD(); } else pushLog('Нельзя экипировать'); }
function dropItem(idx){ const it=state.inv[idx]; if(!it) return; if(confirm('Выбросить '+it.name+'?')){ state.inv.splice(idx,1); renderInv(); pushLog('Вы выбросили '+it.name); } }

/* Quests UI */
function showQuests(){ invPanel.style.display='none'; guildPanel.style.display='none'; questsPanel.style.display='block'; renderQuests(); }
function closeQuests(){ questsPanel.style.display='none'; renderLocation(); }
function renderQuests(){ questsList.innerHTML = state.quests.map(q=>`<div style="margin-bottom:8px"><strong>${q.title}</strong> [${q.status}]<div class="small">${q.desc}${q.progress?('<br>Прогресс: '+q.progress+'/'+q.goal):''}</div></div>`).join(''); }

/* Helpers */
function giveItem(it){ const ex=state.inv.find(x=>x.id===it.id); if(ex) ex.qty += it.qty||1; else state.inv.push({...it}); renderInv(); pushLog('Получен: '+it.name); }
function hasItem(id){ return state.inv.some(x=>x.id===id); }
function removeItemById(id,count=1){ const idx=state.inv.findIndex(x=>x.id===id); if(idx>=0){ state.inv[idx].qty -= count; if(state.inv[idx].qty<=0) state.inv.splice(idx,1); renderInv(); } }

/* LORE and extra quests */
const LORE = { intro:'Остров Кромли — каторжная зона, где кристаллы меняют разум.', history:'Рудная лихорадка...', factions:'Каторжане, Ночники, Секта, Банды' };
function initExtraQuests(){ const qids=state.quests.map(q=>q.id); if(!qids.includes('q6')) state.quests.push({id:'q6',title:'Охота у входа',status:'active',progress:0,goal:3,desc:'Добыть шкуры.'}); if(!qids.includes('q7')) state.quests.push({id:'q7',title:'Мелкая кража',status:'locked',desc:'Выполните кражу для гильдии.'}); if(!qids.includes('q8')) state.quests.push({id:'q8',title:'Кузница: заказ',status:'locked',desc:'Соберите материалы.'}); }
initExtraQuests();

/* Movement & mine */
function enterMine(level){ state.mine.level=level; state.mine.tiles=[]; const oreCount = level===1?8:level===2?12:16; for(let i=0;i<oreCount;i++) state.mine.tiles.push({type:'ore'}); if(level===1) for(let i=0;i<4;i++) state.mine.tiles.push({type:'animal'}); if(level===2){ state.mine.tiles.push({type:'part'}); state.mine.tiles.push({type:'stash'}); } if(level===3){ state.mine.tiles.push({type:'crystal'}); state.mine.tiles.push({type:'ruin'}); } state.location='Шахта: Уровень '+level; renderLocation(); pushLog('Спустились на уровень '+level); }
function exploreMine(){ if(state.mine.tiles.length===0){ pushLog('Пусто'); return; } const tile=state.mine.tiles.shift(); if(tile.type==='ore'){ state.player.ore+=1; pushLog('Найдена руда'); checkQuestsOre(); updateHUD(); } else if(tile.type==='animal'){ pushLog('Найдено животное'); showChoices([{label:'Охотиться', action: ()=>{ if(Math.random()<0.75){ giveItem({id:'hide',name:'Шкура',type:'material',qty:1,desc:'Шкура'}); pushLog('Охота успешна'); checkQuestsHunt(); } else pushLog('Животное убежало'); }},{label:'Продолжить', action: ()=>exploreMine()}]); return; } else if(tile.type==='part'){ giveItem({id:'part',name:'Клапан',type:'part',qty:1,icon:ICONS.part}); pushLog('Клапан найден'); } else if(tile.type==='stash'){ pushLog('Ниша найдена'); if(Math.random()<0.5){ giveItem({id:'goldp',name:'Мешочек',type:'gold',qty:1,amount:25}); pushLog('Золото в нише'); } else { giveItem({id:'rareore',name:'Редкая руда',type:'ore',qty:1,icon:ICONS.ore}); pushLog('Редкая руда'); } } else if(tile.type==='crystal'){ showCrystalChoice(); return; } else if(tile.type==='ruin'){ pushLog('Найден вход в руины'); const q=state.quests.find(x=>x.id==='q4'); if(q) q.status='active'; showChoices([{label:'Исследовать руины', action: exploreRuins},{label:'Отложить', action: ()=>renderLocation()}]); return; } renderInv(); renderLocation(); }

/* Quests */
function checkQuestsOre(){ const q=state.quests.find(x=>x.id==='q1'); if(q && q.status==='active'){ q.progress=(q.progress||0)+1; if(q.progress>=q.goal){ q.status='complete'; pushLog('Квест выполнен'); state.player.gold+=40; state.player.xp+=12; pushLog('+40з +12 XP'); } renderQuests(); } }
function checkQuestsHunt(){ const q=state.quests.find(x=>x.id==='q6'); if(q && q.status==='active'){ q.progress=(q.progress||0)+1; if(q.progress>=q.goal){ q.status='complete'; pushLog('Квест охоты завершён'); state.player.gold+=25; } renderQuests(); } }

/* Guild */
function showGuild(){ invPanel.style.display='none'; questsPanel.style.display='none'; guildPanel.style.display='block'; if(!state.flags.guildJoined){ guildText.innerHTML=`<p>Гильдия требует испытание — украсть сумку у Ночников.</p><div style="margin-top:8px"><button class="locbtn" onclick="attemptGuildJoin()">Принять</button> <button class="locbtn" onclick="closeGuild()">Отказ</button></div>`; } else { guildText.innerHTML=`<p>Вы член гильдии — задания доступны.</p><div style="margin-top:8px"><button class="locbtn" onclick="openGuildJobs()">Задания</button> <button class="locbtn" onclick="closeGuild()">Закрыть</button></div>`; } }
function closeGuild(){ guildPanel.style.display='none'; renderLocation(); }
function attemptGuildJoin(){ const q=state.quests.find(x=>x.id==='q5'); if(q) q.status='active'; pushLog('Гильдия: украсть сумку у Ночников'); closeGuild(); }
function processGuildQuest(){ const q=state.quests.find(x=>x.id==='q5'); if(q && q.status==='active'){ if(state.location==='Причал' && Math.random()<0.6){ giveItem({id:'smug_bag',name:'Сумка Ночников',type:'loot',qty:1}); q.status='complete'; state.flags.guildJoined=true; state.reputation.smug+=2; pushLog('Задание гильдии успешно'); renderInv(); } else { pushLog('Не получилось — попробуйте в Причале'); if(Math.random()<0.3){ state.reputation.smug-=1; pushLog('Репутация Ночников упала'); } } } }
function openGuildJobs(){ showChoices([{label:'Мелкая кража', action: ()=>{ if(Math.random()<0.8){ giveItem({id:'coinbag',name:'Мешочек',type:'gold',qty:1,amount:30}); pushLog('Кража успешна +30з'); state.reputation.smug+=1; } else { pushLog('Провал'); state.reputation.smug-=1; } }},{label:'Крупная операция', action: ()=>{ if(Math.random()<0.5){ giveItem({id:'raregem',name:'Редкий самоцвет',type:'valuable',qty:1}); pushLog('Операция успешна'); } else { pushLog('Провал'); startCombat(); } }}]); }

/* Market/Smith/Healer */
function openMarket(){ storyEl.innerHTML='<p>Рынок Яна.</p>'; showChoices([{label:'Продать руду (7з/ед)', action: ()=>{ if(state.player.ore<=0){ pushLog('Нет руды'); return; } const price=state.player.ore*7; state.player.gold+=price; pushLog('Продано '+state.player.ore+' руды за '+price); state.player.ore=0; updateHUD(); }},{label:'Купить меч 50з', action: ()=>{ if(state.player.gold<50){ pushLog('Нет золота'); return; } state.player.gold-=50; giveItem({id:'short_sword',name:'Короткий меч',type:'weapon',atk:6,qty:1,icon:ICONS.sword}); pushLog('Куплен меч'); updateHUD(); renderInv(); }},{label:'Вернуться', action: ()=>renderLocation()}]); }
function openSmith(){ storyEl.innerHTML='<p>Эдрик — кузнец.</p>'; showChoices([{label:'Ковать меч (5 руды+20з)', action: ()=>{ if(state.player.ore<5||state.player.gold<20){ pushLog('Недостаточно ресурсов'); return; } state.player.ore-=5; state.player.gold-=20; giveItem({id:'crafted_sword',name:'Кованый меч',type:'weapon',atk:8,qty:1,icon:ICONS.sword}); pushLog('Меч выкован'); updateHUD(); renderInv(); }},{label:'Ковать броню (8 руды+40з)', action: ()=>{ if(state.player.ore<8||state.player.gold<40){ pushLog('Недостаточно ресурсов'); return; } state.player.ore-=8; state.player.gold-=40; giveItem({id:'crafted_armor',name:'Кованая броня',type:'armor',armor:6,qty:1,icon:ICONS.armor}); pushLog('Броня готова'); updateHUD(); renderInv(); }},{label:'Вернуться', action: ()=>renderLocation()}]); }
function openHealer(){ storyEl.innerHTML='<p>Хельга лечит.</p>'; showChoices([{label:'Исцеление 30з', action: ()=>{ if(state.player.gold<30){ pushLog('Мало золота'); return; } state.player.gold-=30; state.player.hp=state.player.maxHp; pushLog('Вы исцелены'); updateHUD(); }},{label:'Вернуться', action: ()=>renderLocation()}]); }

/* Combat system */
function startCombat(){ if(state.inCombat){ pushLog('Уже в бою'); return; } let mob; if(state.location.startsWith('Шахта')){ const lvl=state.mine.level||1; if(lvl===1) mob=randomChoice([{name:'Рудная крыса',hp:22,atk:5},{name:'Грибник',hp:18,atk:4}]); if(lvl===2) mob=randomChoice([{name:'Бандит',hp:34,atk:8},{name:'Волк',hp:28,atk:7}]); if(lvl===3) mob=randomChoice([{name:'Теневик',hp:48,atk:11},{name:'Голем',hp:70,atk:13}]); } else if(state.location==='Камера') mob={name:'Охранник',hp:40,atk:9}; else if(state.location==='Причал') mob=randomChoice([{name:'Контрабандист',hp:30,atk:8},{name:'Ночник',hp:36,atk:9}]); else mob={name:'Дикий зверь',hp:20,atk:5}; state.currentMob={...mob}; state.inCombat=true; renderCombatUI(); pushLog('Начало боя: '+state.currentMob.name); }
function renderCombatUI(){ storyEl.innerHTML=`<p>БОЙ: ${state.currentMob.name} (HP:${state.currentMob.hp})</p><p>Ваши HP:${state.player.hp} STA:${state.player.st}</p>`; showChoices([{label:'Атаковать', action: playerAttack},{label:'Уклониться', action: playerDodge},{label:'Использовать предмет', action: ()=>showInv()},{label:'Побежать', action: tryFlee}]); }
function playerAttack(){ if(state.player.st<8){ pushLog('Нет выносливости'); return; } state.player.st-=8; const base=state.player.atk; const crit=Math.random()<0.12; const dmg=Math.max(1,Math.floor(base*(crit?1.8:1))+Math.floor(Math.random()*4)); state.currentMob.hp-=dmg; pushLog('Вы нанесли '+dmg+(crit?' (крит)':'')); if(state.currentMob.hp<=0){ pushLog('Враг повержен'); endCombat(true); return; } setTimeout(mobAttack,300); updateHUD(); }
function playerDodge(){ if(state.player.st<6){ pushLog('Нет выносливости'); return; } state.player.st-=6; if(Math.random()<0.5){ state.currentMob.nextMiss=true; pushLog('Уклонение успешно'); } else { pushLog('Неудача'); mobAttack(); } updateHUD(); }
function mobAttack(){ if(state.currentMob.nextMiss){ pushLog(state.currentMob.name+' промахнулся'); state.currentMob.nextMiss=false; return; } const dmg=Math.max(1,state.currentMob.atk - Math.floor(state.player.armor/2)); state.player.hp-=dmg; pushLog(state.currentMob.name+' наносит '+dmg); if(state.player.hp<=0){ state.player.hp=0; pushLog('Вы пали'); endCombat(false); return; } updateHUD(); }
function tryFlee(){ if(Math.random()<0.5){ pushLog('Убежали'); endCombat(false); } else { pushLog('Не удалось'); mobAttack(); } }
function endCombat(win){ state.inCombat=false; if(win){ const gold=6+Math.floor(Math.random()*12); state.player.gold+=gold; if(Math.random()<0.6){ state.player.ore+=1; pushLog('Добыта руда'); checkQuestsOre(); } if(Math.random()<0.25) giveItem({id:'scrap',name:'Лом',type:'material',qty:1}); pushLog('Награда +'+gold+' зол'); updateHUD(); } else pushLog('Конец боя'); renderLocation(); }

/* Ruins/Press/Dock */
function exploreRuins(){ storyEl.innerHTML='<p>Руины — древние и опасные.</p>'; showChoices([{label:'Осмотреть алтарь', action: ()=>{ if(Math.random()<0.5){ pushLog('Видение — +20 XP'); state.player.xp+=20; } else pushLog('Пусто'); }},{label:'Собрать кристалл (риск)', action: ()=>{ if(Math.random()<0.4){ giveItem({id:'ancient_shard',name:'Древний осколок',type:'quest',qty:1,icon:ICONS.crystal}); state.flags.foundCrystal=true; pushLog('Древний осколок'); } else { pushLog('Защита активна'); startCombat(); } }},{label:'Вернуться', action: ()=>renderLocation()}]); }
function showPress(){ storyEl.innerHTML='<p>Камера-пресс — охраняемая зона.</p>'; showChoices([{label:'Пробраться за документами (скрытно)', action: stealthFindDocs},{label:'Вломиться силой', action: ()=>{ pushLog('Охрана!'); startCombat(); }},{label:'Вернуться', action: ()=>renderLocation()}]); }
function stealthFindDocs(){ const chance = state.flags.guildJoined?0.85:0.45; if(Math.random()<chance){ giveItem({id:'docs',name:'Документы',type:'quest',qty:1}); state.flags.docsTaken=true; pushLog('Документы добыты'); } else { pushLog('Заметили — охрана'); startCombat(); } }
function showDock(){ storyEl.innerHTML='<p>Причал — место сделок Ночников.</p>'; showChoices([{label:'Договориться (50з)', action: tryDealWithSmugglers},{label:'Искать сумки (ворам)', action: ()=>{ if(state.flags.guildJoined) processGuildQuest(); else pushLog('Нужна гильдия'); }},{label:'Вернуться', action: ()=>renderLocation()}]); }
function tryDealWithSmugglers(){ if(state.player.gold>=50){ state.player.gold-=50; state.reputation.smug+=2; state.flags.canEscape=true; pushLog('Ночники согласились помочь'); updateHUD(); } else pushLog('Мало золота'); }

/* Guild quest processing */
function processGuildQuest(){ const q=state.quests.find(x=>x.id==='q5'); if(q && q.status==='active'){ if(state.location==='Причал' && Math.random()<0.6){ giveItem({id:'smug_bag',name:'Сумка Ночников',type:'loot',qty:1}); q.status='complete'; state.flags.guildJoined=true; state.reputation.smug+=2; pushLog('Гильдия: задание выполнено'); renderInv(); } else { pushLog('Не нашли сумку'); if(Math.random()<0.3){ state.reputation.smug-=1; pushLog('Репутация Ночников снизилась'); } } } }

/* Misc helpers */
function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function checkQuestsOre(){ const q=state.quests.find(x=>x.id==='q1'); if(q && q.status==='active'){ q.progress=(q.progress||0)+1; if(q.progress>=q.goal){ q.status='complete'; pushLog('Норма выполнена'); state.player.gold+=40; state.player.xp+=12; pushLog('+40з +12XP'); } renderQuests(); } }
function renderQuests(){ questsList.innerHTML = state.quests.map(q=>`<div style="margin-bottom:8px"><strong>${q.title}</strong> [${q.status}]<div class="small">${q.desc}${q.progress?('<br>Прогресс: '+q.progress+'/'+q.goal):''}</div></div>`).join(''); }

/* Save/load/reset */
function saveGame(){ localStorage.setItem('katorzhnik_save', JSON.stringify(state)); pushLog('Игра сохранена'); }
function loadGame(){ const s=localStorage.getItem('katorzhnik_save'); if(!s){ pushLog('Сохранений нет'); return; } state=JSON.parse(s); updateHUD(); renderInv(); renderQuests(); pushLog('Сохранение загружено'); renderLocation(); }
function resetGame(){ if(!confirm('Сбросить прогресс?')) return; localStorage.removeItem('katorzhnik_save'); location.reload(); }

/* UI render helpers */
function updateHUD(){ hpDisp.innerText=`HP:${state.player.hp}`; stDisp.innerText=`STA:${state.player.st}`; goldDisp.innerText=`₿${state.player.gold}`; repDisp.innerText=`Реп: К${state.reputation.kat} / Н${state.reputation.smug} / С${state.reputation.sect}`; renderQuests(); renderInv(); renderLog(); }
function renderLog(){ logEl.innerHTML = state.logs.join('<br>'); }

/* Location rendering */
function goTo(loc){ if(state.inCombat){ pushLog('Нельзя двигаться во время боя'); return; } state.location=loc; renderLocation(); pushLog('Перемещение: '+loc); }
function enterSpecial(name){ if(name==='Камера') goTo('Камера'); else if(name==='Причал') goTo('Причал'); else if(name==='Руины') goTo('Руины'); renderLocation(); }
function enterMineMenu(){ renderLocation(); }
function renderLocation(){ if(state.location==='Лагерь') showCamp(); else if(state.location.startsWith('Шахта')) { storyEl.innerHTML = `<p>${state.location}. Что делаем?</p>`; showChoices([{label:'Исследовать', action: exploreMine},{label:'Искать бандитов', action: startCombat},{label:'Вернуться в лагерь', action: ()=>goTo('Лагерь')}]); } else if(state.location==='Камера') showPress(); else if(state.location==='Причал') showDock(); else if(state.location==='Руины') exploreRuins(); else showCamp(); }

/* ShowCamp */
function showCamp(){ state.location='Лагерь'; storyEl.innerHTML=`<p>Лагерь каторжан. ${LORE.intro}</p>`; showChoices([{label:'Поговорить с Торном', action: ()=>{ storyEl.innerHTML=`<p>Торн: "Найди клапан — дам улучшение."</p>`; showChoices([{label:'Отдать клапан', action: ()=>{ if(hasItem('part')){ removeItemById('part',1); state.player.atk +=3; pushLog('Клапан отдан — +3 ATK'); updateHUD(); } else pushLog('У вас нет клапана'); }},{label:'Вернуться', action: ()=>showCamp()}]); }},{label:'Поговорить с Мирой', action: ()=>{ storyEl.innerHTML=`<p>Мира: "Ночью на причале обмены."</p>`; showChoices([{label:'Вернуться', action: ()=>showCamp()}]); }},{label:'Кузница', action: openSmith},{label:'Рынок', action: openMarket},{label:'Хельга (лечение)', action: openHealer},{label:'Гильдия', action: showGuild},{label:'Спуститься в шахту', action: ()=>enterMineMenu()} ]); renderQuests(); }

/* Start */
pushLog('Игра загружена. Удачи на Кромли.');
updateHUD();
showCamp();

/* Export globals */
window.goTo = goTo; window.enterMine = enterMine; window.enterSpecial = enterSpecial; window.showInv = showInv; window.closeInv = closeInv; window.showQuests = showQuests; window.closeQuests = closeQuests; window.showGuild = showGuild; window.processGuildQuest = processGuildQuest; window.saveGame = saveGame; window.loadGame = loadGame; window.resetGame = resetGame; window.openSmith = openSmith; window.openMarket = openMarket; window.openHealer = openHealer; window.startCombat = startCombat; window.exploreMine = exploreMine;

</script>
</body>
</html>
