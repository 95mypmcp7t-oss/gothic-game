<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>Морас — прототип</title>
<style>
  html,body{height:100%;margin:0;background:#111;color:#eee;font-family:Arial, sans-serif}
  #game{position:relative;margin:0 auto;background:#222;width:900px;height:600px;overflow:hidden;border:4px solid #444}
  canvas{display:block;background:linear-gradient(#223,#112);width:900px;height:600px}
  #ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  #hud{position:absolute;left:8px;top:8px;color:#fff;pointer-events:auto}
  #hud .stat{background:rgba(0,0,0,0.5);padding:6px;border-radius:4px;margin-bottom:6px}
  #log{position:absolute;left:8px;bottom:8px;width:420px;max-height:180px;overflow:auto;background:rgba(0,0,0,0.5);padding:8px;border-radius:6px;font-size:13px}
  #controls{position:absolute;right:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}
  .btn{width:64px;height:64px;border-radius:8px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;user-select:none;touch-action:none}
  #menu{position:absolute;right:8px;top:8px;pointer-events:auto}
  #menu button{padding:6px 10px;margin-left:6px}
  #panel{position:absolute;left:440px;top:8px;width:440px;height:240px;background:rgba(0,0,0,0.6);padding:8px;border-radius:6px;overflow:auto;pointer-events:auto;font-size:14px}
  .npc{color:#ffea7f}
  .mob{color:#ff8a8a}
  .item{color:#8eeaff}
  #questlog{position:absolute;left:440px;top:260px;width:440px;height:330px;background:rgba(0,0,0,0.6);padding:8px;border-radius:6px;overflow:auto;pointer-events:auto}
  @media (max-width:920px){
    #game{width:100%;height:100vh}
    canvas{width:100%;height:100%}
    #panel,#questlog{display:none}
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="c" width="900" height="600"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="stat">Игрок: <span id="pname">Ардин</span></div>
      <div class="stat">Здоровье: <span id="hp">100</span> | Уровень: <span id="lvl">1</span></div>
      <div class="stat">Репутация — Гильдия: <span id="rep_g">0</span> Контрабандисты: <span id="rep_s">0</span> Рекруты: <span id="rep_r">0</span></div>
    </div>
    <div id="menu">
      <button id="saveBtn">Сохранить</button>
      <button id="loadBtn">Загрузить</button>
      <button id="resetBtn">Сброс</button>
    </div>
    <div id="panel">
      <h3>Сюжет</h3>
      <div id="story">Прибыв в Морас, вы ищете сестру Ардина. Ночью по морю приходят серебристые корабли и туман...</div>
      <hr>
      <div><strong>Рынок:</strong> продавец Торен — продаёт зелья и мечи.</div>
      <div id="market"></div>
    </div>
    <div id="questlog"><h3>Квесты</h3><div id="quests"></div></div>
    <div id="log"></div>
    <div id="controls">
      <div class="btn" id="up">↑</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px">
          <div class="btn" id="left">←</div>
          <div class="btn" id="down">↓</div>
          <div class="btn" id="right">→</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <div class="btn" id="attack">⚔</div>
          <div class="btn" id="interact">✦</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* Простая игровая логика — прототип */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const state = {
  player: {x:450,y:300,w:20,h:28,hp:100,maxHp:100,lvl:1,xp:0,atk:12},
  mobs: [],
  npcs: [],
  items: [],
  marketItems: [],
  quests: [],
  map: {w:1800,h:1200},
  keys: {},
  time:0,
  logs: []
};

function log(s){ state.logs.unshift((new Date()).toLocaleTimeString()+ ' — ' + s); if(state.logs.length>8) state.logs.pop(); renderLog(); }
function renderLog(){ document.getElementById('log').innerHTML = state.logs.map(l=>'&nbsp;'+l).join('<br>'); }

function spawnNPCs(){
  state.npcs = [
    {id:'toren',name:'Торен (продавец)',x:520,y:260,w:20,h:28,dialog:'У меня есть зелья и мечи. Купи, если хочешь быть жив.'},
    {id:'lina',name:'Лина (исследователь)',x:420,y:380,w:18,h:26,dialog:'Кристаллы пробуждают туман. Помоги собрать доказательства.'},
    {id:'mayor',name:'Глашатай',x:700,y:200,w:22,h:30,dialog:'Морас в опасности. Возьмите квест: очистить окрестности.'}
  ];
}

function spawnMarket(){
  state.marketItems = [
    {id:'potion',name:'Зелье (+30 HP)',price:20,type:'consum',effect:{hp:30}},
    {id:'sword1',name:'Короткий меч (+5 ATK)',price:50,type:'weapon',bonus:{atk:5}},
  ];
  renderMarket();
}

function renderMarket(){
  const el = document.getElementById('market');
  el.innerHTML = state.marketItems.map(it=>`<div class="item">${it.name} — ${it.price} зол. <button onclick="buy('${it.id}')">Купить</button></div>`).join('');
}

function buy(id){
  const it = state.marketItems.find(i=>i.id===id);
  if(!it) return;
  // простая экономика: у игрока есть gold в localStorage
  const gold = getPlayerData().gold||100;
  if(gold < it.price){ log('Недостаточно золота'); return; }
  setPlayerData({gold:gold-it.price});
  state.items.push(it);
  log('Куплено: '+it.name);
  saveState();
}

function getPlayerData(){ const s = localStorage.getItem('ard_data'); return s?JSON.parse(s):{gold:100}; }
function setPlayerData(o){ const cur = getPlayerData(); const nxt = {...cur,...o}; localStorage.setItem('ard_data',JSON.stringify(nxt)); renderHUD(); }

function spawnMobs(){
  state.mobs = [
    {id:1,name:'Призрак-бродяга',x:500,y:120,w:18,h:24,hp:30,atk:6},
    {id:2,name:'Туманный волк',x:320,y:450,w:20,h:18,hp:24,atk:8},
    {id:3,name:'Контрабандист',x:650,y:360,w:20,h:28,hp:40,atk:10}
  ];
}

function init(){
  spawnNPCs(); spawnMarket(); spawnMobs();
  // начальные квесты
  state.quests = [
    {id:'q1',title:'Найти следы тумана',desc:'Поговорите с Линой у центра рынка.',status:'active',obj:{type:'talk',target:'lina'}},
    {id:'q2',title:'Очистить окрестности',desc:'Убейте 2 моба у окраин Мораса.',status:'locked',obj:{type:'kill',target:'any',count:2,cur:0}}
  ];
  state.items = [];
  loadState();
  bindControls();
  renderHUD();
  loop();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

function update(){
  state.time++;
  // движение
  const s = 2;
  if(state.keys.up) state.player.y -= s;
  if(state.keys.down) state.player.y += s;
  if(state.keys.left) state.player.x -= s;
  if(state.keys.right) state.player.x += s;
  // mobs basic AI: move toward player if close
  for(const m of state.mobs){
    const dx = state.player.x - m.x, dy = state.player.y - m.y;
    const d = Math.hypot(dx,dy);
    if(d < 220 && d>30){
      m.x += (dx/d)*0.6;
      m.y += (dy/d)*0.6;
    }
    // attack if very close
    if(d <= 30 && state.time % 60 === 0){
      state.player.hp -= m.atk;
      log(m.name+' атакует! -'+m.atk+' HP');
      if(state.player.hp<=0){ state.player.hp=0; log('Вы погибли. Нажмите Сброс чтобы начать заново.'); }
      renderHUD();
    }
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // camera center on player
  const cam = {x:state.player.x - canvas.width/2, y:state.player.y - canvas.height/2};
  // draw ground grid
  ctx.fillStyle = '#334';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // draw a simple town: market area rectangle
  function drawRect(x,y,w,h,color,txt){
    ctx.fillStyle = color; ctx.fillRect(x-cam.x,y-cam.y,w,h);
    if(txt){ ctx.fillStyle='#fff'; ctx.font='12px Arial'; ctx.fillText(txt,x+4-cam.x,y+14-cam.y); }
  }
  drawRect(360,220,160,120,'#3a3','Рынок');
  drawRect(680,160,120,160,'#553','Ратуша');
  drawRect(200,100,140,140,'#444','Причал');
  // draw NPCs
  for(const n of state.npcs){
    ctx.fillStyle = '#ffea7f';
    ctx.fillRect(n.x-cam.x - n.w/2, n.y-cam.y - n.h/2, n.w, n.h);
    ctx.fillStyle='#000'; ctx.font='12px Arial'; ctx.fillText(n.name, n.x-cam.x - n.w/2, n.y-cam.y - n.h/2 - 6);
  }
  // draw mobs
  for(const m of state.mobs){
    ctx.fillStyle = '#ff8a8a';
    ctx.fillRect(m.x-cam.x - m.w/2, m.y-cam.y - m.h/2, m.w, m.h);
    ctx.fillStyle='#fff'; ctx.font='11px Arial'; ctx.fillText(m.name, m.x-cam.x - m.w/2, m.y-cam.y - m.h/2 - 6);
  }
  // draw player
  ctx.fillStyle = '#8eeaff';
  ctx.fillRect(state.player.x-cam.x - state.player.w/2, state.player.y-cam.y - state.player.h/2, state.player.w, state.player.h);
  ctx.fillStyle='#000'; ctx.font='12px Arial'; ctx.fillText('Вы', state.player.x-cam.x - state.player.w/2, state.player.y-cam.y - state.player.h/2 - 6);
  // draw items on ground (none initially)
  // mini markers for quest targets
  for(const q of state.quests){
    if(q.status==='active' && q.obj.type==='talk'){
      const npc = state.npcs.find(n=>n.id===q.obj.target);
      if(npc){
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(npc.x-cam.x, npc.y-cam.y - 28,6,0,Math.PI*2); ctx.fill();
      }
    }
  }
}

function bindControls(){
  // touch/button controls
  const map = {up:'up',down:'down',left:'left',right:'right'};
  ['up','down','left','right'].forEach(k=>{
    const el = document.getElementById(k);
    el.addEventListener('touchstart',e=>{ e.preventDefault(); state.keys[map[k]]=true; });
    el.addEventListener('touchend',e=>{ e.preventDefault(); state.keys[map[k]]=false; });
    el.addEventListener('mousedown',e=>{ state.keys[map[k]]=true; });
    el.addEventListener('mouseup',e=>{ state.keys[map[k]]=false; });
    el.addEventListener('mouseleave',e=>{ state.keys[map[k]]=false; });
  });
  // attack
  document.getElementById('attack').addEventListener('click',()=>playerAttack());
  document.getElementById('attack').addEventListener('touchstart',e=>{ e.preventDefault(); playerAttack(); });
  // interact
  document.getElementById('interact').addEventListener('click',()=>interact());
  document.getElementById('interact').addEventListener('touchstart',e=>{ e.preventDefault(); interact(); });
  // save/load/reset
  document.getElementById('saveBtn').addEventListener('click',saveState);
  document.getElementById('loadBtn').addEventListener('click',loadState);
  document.getElementById('resetBtn').addEventListener('click',resetGame);
  // desktop keys
  window.addEventListener('keydown',e=>{ if(e.key==='w'||e.key==='W') state.keys.up=true; if(e.key==='s'||e.key==='S') state.keys.down=true; if(e.key==='a'||e.key==='A') state.keys.left=true; if(e.key==='d'||e.key==='D') state.keys.right=true; if(e.key===' ') playerAttack(); if(e.key==='e') interact(); });
  window.addEventListener('keyup',e=>{ if(e.key==='w'||e.key==='W') state.keys.up=false; if(e.key==='s'||e.key==='S') state.keys.down=false; if(e.key==='a'||e.key==='A') state.keys.left=false; if(e.key==='d'||e.key==='D') state.keys.right=false; });
}

function playerAttack(){
  // simple melee: damage mobs within radius
  const range = 40;
  let hit = false;
  for(const m of state.mobs){
    const d = Math.hypot(state.player.x - m.x, state.player.y - m.y);
    if(d <= range){
      m.hp -= state.player.atk;
      log('Вы ударили '+m.name+' -'+state.player.atk+' HP');
      hit = true;
      if(m.hp<=0){
        log(m.name+' повержен');
        // drop item occasionally
        if(Math.random()<0.4){
          const loot = {id:'shard',name:'Кристальный осколок',type:'quest'};
          state.items.push(loot);
          log('Получено: '+loot.name);
        }
        // increment quest kill counters
        for(const q of state.quests){
          if(q.status==='active' && q.obj.type==='kill'){
            q.obj.cur = (q.obj.cur||0)+1;
            if(q.obj.cur >= q.obj.count){ q.status='complete'; log('Квест завершён: '+q.title); unlockNext(); }
          }
        }
        // remove mob
        state.mobs = state.mobs.filter(x=>x!==m);
      }
      renderHUD();
    }
  }
  if(!hit) log('Атака по воздуху...');
}

function interact(){
  // check nearby NPCs
  for(const n of state.npcs){
    const d = Math.hypot(state.player.x - n.x, state.player.y - n.y);
    if(d < 40){
      log(n.name+': '+n.dialog);
      // handle simple quest progression: if talk target matches
      for(const q of state.quests){
        if(q.status==='active' && q.obj.type==='talk' && q.obj.target===n.id){
          q.status='complete';
          log('Квест завершён: '+q.title);
          // unlock next quest
          const q2 = state.quests.find(x=>x.id==='q2');
          if(q2) q2.status='active';
        }
      }
      renderQuests();
      renderHUD();
      return;
    }
  }
  log('Никого рядом для взаимодействия.');
}

function renderHUD(){
  document.getElementById('hp').innerText = state.player.hp;
  document.getElementById('lvl').innerText = state.player.lvl;
  document.getElementById('pname').innerText = 'Ардин';
  const pd = getPlayerData();
  document.getElementById('rep_g').innerText = pd.rep_g||0;
  document.getElementById('rep_s').innerText = pd.rep_s||0;
  document.getElementById('rep_r').innerText = pd.rep_r||0;
}

function renderQuests(){
  const el = document.getElementById('quests');
  el.innerHTML = state.quests.map(q=>{
    const status = q.status;
    let body = `<div><strong>${q.title}</strong> [${status}]<div style="font-size:13px">${q.desc}</div>`;
    if(status==='active' && q.obj.type==='kill'){ body += `<div>Прогресс: ${q.obj.cur||0}/${q.obj.count}</div>`; }
    body += '</div><hr>';
    return body;
  }).join('');
}

function saveState(){
  const save = {
    player: state.player,
    items: state.items,
    quests: state.quests,
    mobs: state.mobs,
    npcs: state.npcs,
    market: state.marketItems,
    pdata: getPlayerData()
  };
  localStorage.setItem('ard_save', JSON.stringify(save));
  log('Игра сохранена');
}

function loadState(){
  const s = localStorage.getItem('ard_save');
  if(!s){ log('Сохранений не найдено.'); return; }
  try{
    const save = JSON.parse(s);
    state.player = save.player || state.player;
    state.items = save.items || state.items;
    state.quests = save.quests || state.quests;
    state.mobs = save.mobs || state.mobs;
    state.npcs = save.npcs || state.npcs;
    state.marketItems = save.market || state.marketItems;
    if(save.pdata) localStorage.setItem('ard_data', JSON.stringify(save.pdata));
    renderMarket();
    renderHUD();
    renderQuests();
    log('Сохранение загружено');
  }catch(e){ log('Ошибка загрузки: '+e.message); }
}

function resetGame(){
  if(!confirm('Сбросить прогресс?')) return;
  localStorage.removeItem('ard_save');
  localStorage.removeItem('ard_data');
  state.player = {x:450,y:300,w:20,h:28,hp:100,maxHp:100,lvl:1,xp:0,atk:12};
  init();
  log('Игра сброшена');
}

function unlockNext(){
  // simple example: when q1 complete unlock q2 (done earlier), when q2 complete give reward
  const q2 = state.quests.find(q=>q.id==='q2');
  if(q2 && q2.status==='complete'){
    log('Вы получили 30 золота и повыли уровнем.');
    const pd = getPlayerData();
    setPlayerData({gold:(pd.gold||100)+30, rep_g:(pd.rep_g||0)+1});
    state.player.lvl += 1;
    state.player.maxHp += 10;
    state.player.hp = state.player.maxHp;
    renderHUD();
    renderQuests();
  }
}

function loadStateOnStart(){
  renderQuests();
  renderMarket();
  renderHUD();
  renderLog();
}

function saveStateOnUnload(){ saveState(); }
window.addEventListener('beforeunload',saveStateOnUnload);

init();
loadStateOnStart();
</script>
</body>
</html>
