<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gothic: Echo of the Barrier</title>
    <style>
        body { background-color: #1a1a1a; color: #d4af37; font-family: 'Georgia', serif; display: flex; justify-content: center; padding: 20px; }
        #game-container { width: 600px; border: 2px solid #444; padding: 20px; background: #2c2c2c; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #log { height: 300px; overflow-y: auto; border-bottom: 1px solid #444; margin-bottom: 10px; padding-bottom: 10px; }
        .stats { margin-bottom: 15px; font-weight: bold; color: #aaa; }
        button { background: #444; color: #fff; border: 1px solid #d4af37; padding: 10px; cursor: pointer; margin-right: 5px; }
        button:hover { background: #d4af37; color: #000; }
    </style>
</head>
<body>
    <div id="game-container">
        <h2>Эхо Барьера: Выживание</h2>
        <div class="stats">Здоровье: <span id="hp">100</span> | Золото: <span id="gold">0</span></div>
        <div id="log">Вы стоите на окраине леса Хориниса. Вдали виднеются башни города. Что вы предпримете?</div>
        <div id="actions">
            <button onclick="action('hunt')">Охотиться в лесу</button>
            <button onclick="action('city')">Пойти в город</button>
        </div>
    </div>

    <script>
        let hp = 100;
        let gold = 0;

        function action(type) {
            const log = document.getElementById('log');
            if (type === 'hunt') {
                hp -= 10;
                gold += 20;
                log.innerHTML += "<br>Вы подстрелили падальщика, но получили пару царапин. (+20 золота, -10 HP)";
            } else if (type === 'city') {
                log.innerHTML += "<br>Стража подозрительно смотрит на вас, но пропускает. Вы в безопасности.";
            }
            document.getElementById('hp').innerText = hp;
            document.getElementById('gold').innerText = gold;
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
